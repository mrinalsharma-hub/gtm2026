* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent !important; }
*, *::before, *::after, button, a { -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none !important; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  background-color: #F8F4EA !important;
  font-family: 'Cinzel', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  justify-content: center;
}

.home-mobile-canvas {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background-color: #F8F4EA;
}

@media (min-width: 1024px) {
  .home-mobile-canvas {
    max-width: 440px;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }
}

/* ── 1. Background Texture Layer (Clean Warm Cream Throughout) ── */
.home-bg-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
  background-color: #F8F4EA;
}
.home-img-watermark {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.15) translateX(-5px);
  opacity: 1.0;
  pointer-events: none;
}

/* ── 2. Flowers Top (Scaled & Anchored Top Center) ── */
.home-flowers-top {
  filter: drop-shadow(6px 12px 14px rgba(50, 20, 10, 0.28));
  position: absolute;
  top: -8px;
  left: 50% !important;
  transform: translateX(-50%);
  width: min(291px, 72vw);
  height: auto;
  pointer-events: none;
  z-index: 3;
  transform-origin: center top;
  animation: gentleFloralBreeze 7.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
  will-change: transform;
}
.home-flowers-top img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  aspect-ratio: 247 / 266;
}
.home-flowers-top img {
  width: 100%;
  height: auto;
  display: block;
}

@keyframes gentleFloralBreeze {
  0% { transform: translateX(-50%) rotate(0deg) translateY(0px); }
  30% { transform: translateX(-50%) rotate(1.2deg) translateY(-1px) skewX(-0.4deg); }
  70% { transform: translateX(-50%) rotate(-0.8deg) translateY(-2px) skewX(0.3deg); }
  100% { transform: translateX(-50%) rotate(1.4deg) translateY(-0.5px) skewX(-0.5deg); }
}

/* ── 3. Central Typography (Truly Doubled: 120px+ Scale, Bold Presence, Thin Hairline Serifs) ── */
.home-hero-text {
  position: absolute;
  top: 48%;
  left: 50% !important;
  transform: translate(-50%, -50%) !important;
  width: 100% !important;
  max-width: 440px;
  height: 340px;
  z-index: 2;
  pointer-events: none;
}

.home-name {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  text-align: center;
  margin: 0;
  font-family: 'Cinzel', serif;
  font-size: clamp(68px, 18.5vw, 80px) !important;
  font-weight: 300 !important;
  line-height: 0.9 !important;
  letter-spacing: 0.05em !important;
  background: linear-gradient(180deg, #d03a3e 19.186%, #c81a1f 43.023%, #a71f23 79.651%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #c81a1f;
  text-transform: uppercase;
  white-space: nowrap;
}

.home-script-wrap {
  position: absolute;
  top: 122px;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  text-align: center;
  display: flex;
  justify-content: center;
  margin: 0;
  z-index: 3;
}

.home-script {
  font-family: 'WindSong', cursive !important;
  font-size: clamp(92px, 24vw, 112px) !important;
  font-weight: 400 !important;
  line-height: 0.85 !important;
  color: #c81a1f !important;
  text-transform: none !important;
  display: inline-block;
  white-space: nowrap;
}

.home-date-location {
  position: absolute;
  top: 295px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  text-align: center;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.home-date-location p {
  font-family: 'Cinzel', serif;
  font-size: clamp(18px, 4.6vw, 22px);
  font-weight: 400;
  line-height: 26px;
  color: #0b4c6d;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0;
}

/* ── 4. Butterfly (Centered Below Date, Flapping Wings) ── */
.home-butterfly-wrap {
  position: absolute;
  top: auto;

  const bgMusic = document.getElementById('bg-music');

  function isAuthed() {
    return sessionStorage.getItem('gtm2026_auth') === 'true' || localStorage.getItem('gtm2026_auth') === 'true';
  }

  function unlockAllTabs() {
    document.querySelectorAll('.fixed-bottom-nav .nav-tab').forEach(function(tab) {
      tab.classList.remove('is-locked');
    });
  }

  if (isAuthed()) {
    unlockAllTabs();

  function updateMusicUI(isPlaying) {
    if (musicToggle) {
      if (isPlaying) {
        musicToggle.classList.add('is-playing');
      } else {
        musicToggle.classList.remove('is-playing');
      }
    }
  }

  const wasPlaying = sessionStorage.getItem('gtm2026_music_playing') !== 'false';
  if (bgMusic && wasPlaying) {
    bgMusic.volume = 0.8;
    const p = bgMusic.play();
    if (p !== undefined) {
      p.then(() => updateMusicUI(true)).catch(() => updateMusicUI(false));
    }
  }

  function unlockAudio() {
    if (bgMusic && bgMusic.paused && wasPlaying) {
      bgMusic.play().then(() => updateMusicUI(true)).catch(() => {});
    }
    window.removeEventListener('touchstart', unlockAudio, { capture: true });
    window.removeEventListener('pointerdown', unlockAudio, { capture: true });
    window.removeEventListener('click', unlockAudio, { capture: true });
  }
  window.addEventListener('touchstart', unlockAudio, { capture: true, once: true });
  window.addEventListener('pointerdown', unlockAudio, { capture: true, once: true });
  window.addEventListener('click', unlockAudio, { capture: true, once: true });

  if (musicToggle) {
    musicToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!bgMusic) return;
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          updateMusicUI(true);
          sessionStorage.setItem('gtm2026_music_playing', 'true');
        }).catch(() => {});
      } else {
        bgMusic.pause();
        updateMusicUI(false);
        sessionStorage.setItem('gtm2026_music_playing', 'false');
      }
    });
  }

  // 2. Open Passcode Interface Modal Flow
  window.handleOpenDetails = function(e) {
    if (e && e.preventDefault) e.preventDefault();

    if (isAuthed()) {
      window.location.href = 'events.html';
      return;
    }

    if (pinInput) {
      pinInput.focus();
      pinInput.select();
    }

    if (butterflyWrap) {
      butterflyWrap.classList.add('fly-to-flowers');
    }

    if (authBackdrop) {
      authBackdrop.classList.add('expand-fullscreen');
    }

    if (btnViewDetails) {
      btnViewDetails.classList.add('is-hidden');
    }

    if (pinModal) {
      pinModal.classList.add('is-active');
    }

    checkPinInput();
  };

  if (btnViewDetails) {
    btnViewDetails.addEventListener('click', function(e) {
      if (isAuthed()) {
        window.location.href = 'events.html';
      } else {
        window.handleOpenDetails(e);
      }
    });
  }

  // Intercept locked tab clicks
  document.querySelectorAll('.fixed-bottom-nav .nav-tab').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      var href = tab.getAttribute('href');
      if (href && href !== 'gm.html' && href !== 'index.html' && !isAuthed()) {
        e.preventDefault();
        e.stopPropagation();
        window.handleOpenDetails(e);
      }
    });
  });

  // 3. Password Verification Logic
  function isCodeValid(val) {
    var clean = (val || '').trim().toLowerCase();
    return clean === 'gtm2026' || clean === 'gtm';
  }

  function checkPinInput() {
    if (!pinInput || !btnPinSubmit) return;
    const isValid = isCodeValid(pinInput.value);
    if (isValid) {
      btnPinSubmit.classList.add('is-enabled');
      btnPinSubmit.removeAttribute('disabled');
      if (pinError) pinError.style.display = 'none';
    } else {
      btnPinSubmit.classList.remove('is-enabled');
      btnPinSubmit.setAttribute('disabled', 'disabled');
    }
  }

  let isSubmitting = false;
  let blurTimeout = null;

  function handleCloseModal() {
    if (!pinModal || !pinModal.classList.contains('is-active')) return;
    if (isSubmitting) return;

    if (blurTimeout) {
      clearTimeout(blurTimeout);
      blurTimeout = null;
    }

    if (pinInput) {
      pinInput.blur();
      pinInput.value = '';
      checkPinInput();
    }
    if (pinError) pinError.style.display = 'none';

    pinModal.classList.remove('is-active');

    if (authBackdrop) {
      authBackdrop.classList.remove('expand-fullscreen');
    }

    if (butterflyWrap) {
      butterflyWrap.classList.remove('fly-to-flowers');
    }

    setTimeout(() => {
      if (btnViewDetails) btnViewDetails.classList.remove('is-hidden');
    }, 400);
  }

  if (btnPinCancel) {
    btnPinCancel.addEventListener('click', function(e) {
      e.preventDefault();
      handleCloseModal();
    });
  }

  if (pinInput) {
    pinInput.addEventListener('input', checkPinInput);
    pinInput.addEventListener('keyup', checkPinInput);
    pinInput.addEventListener('paste', function() {
      setTimeout(checkPinInput, 10);
    });
    pinInput.addEventListener('focus', function() {
      if (blurTimeout) clearTimeout(blurTimeout);
    });
    pinInput.addEventListener('blur', function() {
      if (isSubmitting) return;
      blurTimeout = setTimeout(() => {
        if (pinModal && pinModal.classList.contains('is-active') && !isSubmitting) {
          handleCloseModal();
        }
      }, 180);
    });
    pinInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitPin();
      }
    });
  }

  function submitPin() {
    if (pinInput && isCodeValid(pinInput.value)) {
      isSubmitting = true;
      if (blurTimeout) clearTimeout(blurTimeout);
      sessionStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_auth', 'true');
      sessionStorage.setItem('gtm2026_music_playing', (bgMusic && !bgMusic.paused) ? 'true' : 'false');
      unlockAllTabs();
      window.location.href = 'events.html';
    } else {
      isSubmitting = false;
      if (pinError) pinError.style.display = 'block';
    }
  }

  if (btnPinSubmit) {
    btnPinSubmit.addEventListener('click', function(e) {
      e.preventDefault();
      submitPin();
    });
  }
});
</script>
