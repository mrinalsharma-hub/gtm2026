<style>
/* ── CRITICAL ZERO-CACHE STYLES FOR FIGMA NODE 340:113 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #A71F23;
  font-family: 'Cinzel', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
}

.home-mobile-canvas {
  position: relative;
  width: 100vw;
  max-width: 440px;
  height: 100svh;
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background: #FFFFFF;
}

/* ── 1. Background Layers ── */
.home-layer-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
  background-color: #FAF6F0;
}
.home-img-texture {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0.85;
  mix-blend-mode: multiply;
}
.home-img-gradient {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  opacity: 0.95;
  mix-blend-mode: multiply;
}

/* ── 2. Top Flower Cascade ── */
.home-flowers-top {
  position: absolute;
  top: -4px;
  left: calc(50% + 24px);
  transform: translateX(-50%);
  width: 295px;
  height: 395px;
  max-width: 68vw;
  pointer-events: none;
  z-index: 3;
}
.home-flowers-top img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ── 3. Central Typography Group ── */
.home-hero-text {
  position: absolute;
  top: 48%;
  left: 0;
  width: 100%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 4;
  padding: 0 16px;
  pointer-events: none;
}

.home-name {
  font-family: 'Cinzel', serif;
  font-size: clamp(46px, 14vw, 64px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 1.28px;
  background: linear-gradient(180deg, #d03a3e 19.186%, #c81a1f 43.023%, #a71f23 79.651%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #c81a1f;
  margin: 0;
  text-transform: uppercase;
}

.home-script {
  font-family: 'WindSong', cursive;
  font-size: clamp(54px, 16.5vw, 70px);
  font-weight: 400;
  line-height: 0.9;
  color: #c81a1f;
  letter-spacing: 3.5px;
  margin: -16px 0 -12px;
  display: block;
}

.home-date-location {
  margin-top: 18px;
}
.home-date-location p {
  font-family: 'Cinzel', serif;
  font-size: clamp(18px, 5.2vw, 24px);
  font-weight: 400;
  line-height: 1.25;
  color: #0b4c6d;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0;
}

/* ── 4. Center Bottom Butterfly ── */
.home-butterfly-wrap {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 74px;
  width: 164px;
  height: 123px;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0px 6px 14px rgba(0, 0, 0, 0.25));
  animation: butterflyFloat 4.5s ease-in-out infinite alternate;
}
.home-butterfly-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

@keyframes butterflyFloat {
  0% { transform: translateX(-50%) translateY(0px) scale(1); }
  50% { transform: translateX(-50%) translateY(-5px) scale(1.02); }
  100% { transform: translateX(-50%) translateY(2px) scale(0.99); }
}

/* ── 5. Bottom Red Arch / Dome ── */
.home-bottom-dome {
  position: absolute;
  bottom: -868px;
  left: 50%;
  transform: translateX(-50%);
  width: 981px;
  height: 981px;
  border-radius: 50%;
  background: #C81A1F;
  box-shadow: inset 0 2px 21px rgba(255, 255, 255, 0.1);
  z-index: 5;
  pointer-events: none;
}

/* ── 6. ONLY CLICKABLE ELEMENT: "[🔒] View details" ── */
.home-view-details-btn {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom, 22px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #FFFFFF;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  padding: 10px 24px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
}
.home-view-details-btn:active {
  transform: translateX(-50%) scale(0.94);
  opacity: 0.85;
}
.home-lock-icon {
  width: 19px;
  height: 19px;
  stroke: #FFFFFF;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.home-view-details-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  line-height: 1;
}
</style>
</head>
<body>

<main class="home-mobile-canvas">

  <!-- ── 1. Background Layers ── -->
  <div class="home-layer-bg" aria-hidden="true">

    <img src="images/bg_gradient.png" alt="" class="home-img-gradient">

    <span class="home-script">takes</span>

  <!-- ── 4. Center Bottom Butterfly ── -->
  <div class="home-butterfly-wrap" aria-hidden="true">

  </div>

  <!-- ── 5. Bottom Red Dome ── -->
  <div class="home-bottom-dome" aria-hidden="true"></div>

  <a href="schedule.html" id="btn-view-details" class="home-view-details-btn" aria-label="View Details">
    <svg class="home-lock-icon" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>

  </a>

</main>

<script>
