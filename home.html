<style>
/* ── CRITICAL EXACT STYLING FROM FIGMA NODE 340:113 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #F8F4EA !important;
  font-family: 'Cinzel', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
}

.home-mobile-canvas {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 100svh;
  margin: 0;
  overflow: hidden;
  background-color: #F8F4EA;
}

/* ── 1. Background Texture & Watermark Arch Layer ── */
.home-bg-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
  background-color: #F8F4EA;
}
.home-img-watermark {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.50;
  pointer-events: none;
}

/* ── 2. Flowers Top (Exact Figma 340:149 SVG with light breeze swaying) ── */
.home-flowers-top {
  position: absolute;
  top: -12px;
  left: calc(50% + 17.5px);
  transform: translateX(-50%);
  width: min(291px, 66.14vw);
  height: auto;
  pointer-events: none;
  z-index: 3;
  transform-origin: 75% -10px;
  animation: gentleFloralBreeze 7.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
  will-change: transform;
}
.home-flowers-top img {
  width: 100%;
  height: auto;
  display: block;
}

@keyframes gentleFloralBreeze {
  0% {
    transform: translateX(-50%) rotate(0deg) translateY(0px);
  }
  30% {
    transform: translateX(-50%) rotate(1.2deg) translateY(-1px) skewX(-0.4deg);
  }
  70% {
    transform: translateX(-50%) rotate(-0.8deg) translateY(-2px) skewX(0.3deg);
  }
  100% {
    transform: translateX(-50%) rotate(1.4deg) translateY(-0.5px) skewX(-0.5deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .home-flowers-top {
    animation: none;
  }
}

@font-face {
  font-family: 'WindSong';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('https://fonts.gstatic.com/s/windsong/v13/KR1RBsyu-P-GFEW57oeNNPWy.woff2') format('woff2'),
       url('https://fonts.gstatic.com/s/windsong/v13/KR1WBsyu-P-GFEW57r95.ttf') format('truetype');
}
@font-face {
  font-family: 'WindSong';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('https://fonts.gstatic.com/s/windsong/v13/KR1RBsyu-P-GFEW57oeNNPWy.woff2') format('woff2'),
       url('https://fonts.gstatic.com/s/windsong/v13/KR1WBsyu-P-GFEW57r95.ttf') format('truetype');
}

/* ── 3. Typography Group (Figma 340:176 Specs with Rock-Solid Mobile Flow) ── */
.home-hero-text {
  position: absolute;
  top: calc(50% + 30px);
  left: 0;
  width: 100%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 4;
  padding: 0 16px;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-name {
  font-family: 'Cinzel', serif;
  font-size: clamp(40px, 12.8vw, 64px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 1.28px;
  background: linear-gradient(180deg, #d03a3e 19.186%, #c81a1f 43.023%, #a71f23 79.651%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #c81a1f;
  margin: 0;
  text-transform: uppercase;
}

.home-script-wrap {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: -14px 0 -10px;
}

.home-script {
  font-family: 'WindSong', cursive !important;
  font-size: clamp(48px, 15vw, 70px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 3.5px;
  color: #c81a1f;
  text-transform: none !important;
  display: block;
}

.home-date-location {
  margin-top: 14px;
  text-align: center;
}

.home-date-location p {
  font-family: 'Cinzel', serif;
  font-size: clamp(16px, 4.8vw, 24px);
  font-weight: 400;
  line-height: 26px;
  color: #0b4c6d;
  letter-spacing: normal;
  text-transform: uppercase;
  margin: 0;
}

/* ── 4. Butterfly (Figma 340:174) ── */
.home-butterfly-wrap {
  position: absolute;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%);
  width: 155px;
  max-width: 36vw;
  height: auto;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0px 4px 14px rgba(0, 0, 0, 0.25));
}
.home-butterfly-wrap img {
  width: 100%;
  height: auto;
  display: block;
}

/* ── 5. Bottom Red Dome (Figma 340:183) ── */
.home-bottom-dome {
  position: absolute;
  bottom: -868px;
  left: 50%;
  transform: translateX(-50%);
  width: 981px;
  height: 981px;
  z-index: 5;
  pointer-events: none;
}
.home-bottom-dome img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ── 6. ONLY CLICKABLE ELEMENT: "[🔒] View details" ── */
.home-view-details-btn {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom, 22px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #FFFFFF;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  padding: 10px 24px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
}
.home-view-details-btn:active {
  transform: translateX(-50%) scale(0.94);
  opacity: 0.85;
}
.home-lock-icon {
  width: 19px;
  height: 19px;
  stroke: #FFFFFF;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.home-view-details-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  line-height: 1;
}
</style>

<body>

<main class="home-mobile-canvas">

  <!-- ── 1. Background Texture & Watermark Arch ── -->

    <img src="images/Flowers_top.svg" alt="Orchids and Flowers">
  </div>

  <!-- ── 3. Central Typography (Figma 340:176) ── -->
  <div class="home-hero-text">
    <h1 class="home-name">GARIMA</h1>
    <div class="home-script-wrap">
      <span class="home-script">takes</span>

    <div class="home-date-location">

    </div>
  </div>

  <!-- ── 4. Butterfly (Figma 340:174) ── -->
  <div class="home-butterfly-wrap" aria-hidden="true">
    <img src="images/home_butterfly.png" alt="Golden Butterfly">
  </div>

  <!-- ── 5. Bottom Red Dome (Figma 340:183) ── -->
  <div class="home-bottom-dome" aria-hidden="true">
    <img src="images/home_bottom_dome.svg" alt="">
  </div>

  <!-- ── 6. ONLY CLICKABLE ELEMENT: "[🔒] View details" ── -->
  <a href="schedule.html" id="btn-view-details" class="home-view-details-btn" aria-label="View Details">
    <svg class="home-lock-icon" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span class="home-view-details-label">View details</span>
  </a>

</main>

<script>
// Preserve query parameters (e.g. guest name, passcodes) when navigating
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.getElementById('btn-view-details');
  if (btn && window.location.search) {
    btn.href = 'schedule.html' + window.location.search + window.location.hash;
  }
});

// Mathematically place hero text block in the middle between flowers bottom and butterfly top
function centerHeroTextBetweenFlowersAndButterfly() {
  var flowers = document.querySelector('.home-flowers-top');
  var butterfly = document.querySelector('.home-butterfly-wrap');
  var heroText = document.querySelector('.home-hero-text');
  if (flowers && butterfly && heroText) {
    var fBottom = flowers.getBoundingClientRect().bottom;
    var bTop = butterfly.getBoundingClientRect().top;
    var midY = (fBottom + bTop) / 2;
    heroText.style.top = midY + 'px';
    heroText.style.transform = 'translateY(-50%)';
  }
}

window.addEventListener('load', centerHeroTextBetweenFlowersAndButterfly);
window.addEventListener('resize', centerHeroTextBetweenFlowersAndButterfly);
if (document.fonts) {
  document.fonts.ready.then(centerHeroTextBetweenFlowersAndButterfly);
}
</script>
