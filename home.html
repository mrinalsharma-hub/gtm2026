<style>
/* ── CRITICAL ZERO-CACHE MOBILE STYLES FOR HOME.HTML ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #FFFFFF;
  font-family: 'Cinzel', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.home-mobile-canvas {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100svh;
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
}

/* ── 1. Background Layers ── */
.home-layer-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.home-img-texture {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: bottom;
  opacity: 0.70;
  transform: rotate(180deg);
}
.home-img-gradient {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  mix-blend-mode: soft-light;
  opacity: 0.50;
}

/* ── 2. Top Flower Cascade ── */
.home-flowers-top {
  position: absolute;
  top: -2px;
  left: calc(50% + 17.5px);
  transform: translateX(-50%);
  width: 291px;
  height: 389px;
  max-width: 70vw;
  pointer-events: none;
  z-index: 3;
}
.home-flowers-top img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ── 3. Central Typography Group ── */
.home-hero-text {
  position: absolute;
  top: calc(50% + 22px);
  left: 0;
  width: 100%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 4;
  padding: 0 16px;
  pointer-events: auto;
}

.home-name {
  font-family: 'Cinzel', serif;
  font-size: clamp(48px, 14vw, 64px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 1.28px;
  background: linear-gradient(180deg, #d03a3e 19.186%, #c81a1f 43.023%, #a71f23 79.651%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #c81a1f;
  margin: 0;
  text-transform: uppercase;
}

.home-script {
  font-family: 'WindSong', cursive;
  font-size: clamp(54px, 16vw, 70px);
  font-weight: 400;
  line-height: 1;
  color: #c81a1f;
  letter-spacing: 3.5px;
  margin: -18px 0 -14px;
  display: block;
}

.home-date-location {
  margin-top: 20px;
}
.home-date-location p {
  font-family: 'Cinzel', serif;
  font-size: clamp(18px, 5.2vw, 24px);
  font-weight: 400;
  line-height: 1.25;
  color: #0b4c6d;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0;
}

/* ── 4. Center Bottom Butterfly ── */
.home-butterfly-wrap {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 74px;
  width: 164px;
  height: 123px;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0px 6px 14px rgba(0, 0, 0, 0.25));
  animation: butterflyFloat 4.5s ease-in-out infinite alternate;
}
.home-butterfly-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

@keyframes butterflyFloat {
  0% { transform: translateX(-50%) translateY(0px) scale(1); }
  50% { transform: translateX(-50%) translateY(-5px) scale(1.02); }
  100% { transform: translateX(-50%) translateY(2px) scale(0.99); }
}

/* ── 5. Bottom Red Arch / Dome ── */
.home-bottom-dome {
  position: absolute;
  bottom: -868px;
  left: 50%;
  transform: translateX(-50%);
  width: 981px;
  height: 981px;
  border-radius: 50%;
  background: #C81A1F;
  box-shadow: inset 0 2px 21px rgba(255, 255, 255, 0.1);
  z-index: 5;
}

/* ── 6. "View details" Action Button ── */
.home-view-details-btn {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom, 22px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #FFFFFF;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  padding: 8px 16px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
}
.home-view-details-btn:active {
  transform: translateX(-50%) scale(0.94);
  opacity: 0.85;
}
.home-lock-icon {
  width: 18px;
  height: 18px;
  stroke: #FFFFFF;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.home-view-details-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  line-height: 1;
}

/* ── 7. Celebration Gateway Modal / Drawer ── */
.gateway-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 2, 4, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 999999;
  display: none;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.35s ease;
}
.gateway-overlay.active {
  display: flex;
  opacity: 1;
}
.gateway-card {
  width: 100%;
  max-width: 440px;
  background: #FCF3E7;
  border-radius: 32px 32px 0 0;
  padding: 32px 24px max(32px, env(safe-area-inset-bottom, 32px));
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.4);
  position: relative;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
}
.gateway-overlay.active .gateway-card {
  transform: translateY(0);
}
.gateway-drag-handle {
  width: 44px;
  height: 4px;
  border-radius: 2px;
  background: rgba(25, 32, 47, 0.25);
  margin: 0 auto 20px;
}
.gateway-card h2 {

  text-align: center;

}
.gateway-card p.sub {

  font-size: 17px;
  color: rgba(25, 32, 47, 0.75);
  text-align: center;
  line-height: 1.4;
  margin-bottom: 24px;
}
.gateway-btn-row {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.gateway-action-btn {
  width: 100%;
  height: 54px;
  border-radius: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s;
  border: none;
}
.gateway-action-btn:active { transform: scale(0.97); }
.gateway-action-btn.primary {
  background: linear-gradient(135deg, #C81A1F 0%, #A71F23 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(167, 31, 35, 0.4);
}
.gateway-action-btn.secondary {
  background: rgba(167, 31, 35, 0.08);
  color: #A71F23;
  border: 1.5px solid rgba(167, 31, 35, 0.25);
}
.gateway-close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(25, 32, 47, 0.06);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #19202F;
}
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var viewDetailsBtn = document.getElementById('btn-view-details');
  var overlay = document.getElementById('gateway-overlay');
  var closeBtn = document.getElementById('gateway-close-btn');

  function openGateway() {
    if (overlay) overlay.classList.add('active');
  }
  function closeGateway() {
    if (overlay) overlay.classList.remove('active');
  }

  if (viewDetailsBtn) {
    viewDetailsBtn.addEventListener('click', openGateway);
  }
  if (closeBtn) {
    closeBtn.addEventListener('click', closeGateway);
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeGateway();
    });
  }
});
</script>
