.home-flowers-top img {

@keyframes gentleFloralBreeze {

  30% { transform: translateX(-50%) rotate(1.2deg) translateY(-1px) skewX(-0.4deg); }
  70% { transform: translateX(-50%) rotate(-0.8deg) translateY(-2px) skewX(0.3deg); }

.home-hero-text {

.home-butterfly-wrap {
  position: absolute;

  bottom: 78px;
  left: 50%;
  transform: translateX(-50%);
  width: 164px;
  height: 123px;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0px 4px 14px rgba(0, 0, 0, 0.25));
}

.flight-container {
  width: 100%;
  height: 100%;
  animation: swoop 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  transform-origin: center;
}

.bob-container {
  width: 100%;
  height: 100%;
  animation: bob 4s ease-in-out forwards;
}

.wing-flap {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  animation: wobble-fly 0.15s ease-in-out infinite;
  transform-origin: center;
}

@keyframes wobble-fly {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(12deg); }
  75% { transform: rotate(-12deg); }
  100% { transform: rotate(0deg); }
}

@keyframes swoop {
  0% {
    transform: translate(300px, -800px) rotate(-45deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  30% {
    transform: translate(150px, -400px) rotate(-15deg);
  }
  55% {
    transform: translate(-100px, -250px) rotate(20deg);
  }
  75% {
    transform: translate(-50px, -50px) rotate(10deg);
  }
  100% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 1;
  }
}

@keyframes bob {
  0%, 20%, 40%, 60%, 80% { transform: translateY(-15px); }
  10%, 30%, 50%, 70% { transform: translateY(15px); }
  90%, 100% { transform: translateY(0); }
}

<body>

<main class="home-mobile-canvas">

  <!-- ── 1. Background Texture ── -->
  <div class="home-bg-layer" aria-hidden="true">
    <img src="images/Home_background_optimized.webp" alt="" class="home-img-watermark">
  </div>

  <!-- ── 2. Flowers Top (Super Optimized 120KB WebP) ── -->
  <div class="home-flowers-top" aria-hidden="true">

  </div>

  <!-- ── 3. Central Typography ── -->
  <div class="home-hero-text">
    <h1 class="home-name" style="top: 43px;">GARIMA</h1>
    <div class="home-script-wrap">
      <span class="home-script">takes</span>

    <h1 class="home-name" style="top: 162px;">MRINAL</h1>

    <div class="home-date-location">
      <p>NOV 21, 2026</p>
      <p>NAINITAL, INDIA</p>
    </div>

  <!-- ── 4. Butterfly (Optimized 656KB WebP) ── -->
  <div class="home-butterfly-wrap" aria-hidden="true">

  <button id="music-toggle" aria-label="Toggle Music" style="position: fixed; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(126, 18, 22, 0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.12); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; outline: none; transition: transform 0.2s ease, opacity 0.2s ease;">
    <svg id="music-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="#7e1216">
      <path d="M8 5v14l11-7z"/>

<script src="js/pjax.js?v=999"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const bgMusic = document.getElementById('bg-music');
  const musicToggle = document.getElementById('music-toggle');
  const playIcon = document.getElementById('music-play-icon');
  const pauseIcon = document.getElementById('music-pause-icon');
  const wing = document.querySelector('.wing-flap');

  // Slow down butterfly flap by 40% when landing at 4 seconds
  setTimeout(() => {
    if (wing) wing.style.animationDuration = '0.25s';
  }, 4000);

  function updateMusicUI(isPlaying) {
    if (isPlaying) {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  }

  // Attempt autoplay
  if (bgMusic) {
    const playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        updateMusicUI(true);
      }).catch(() => {
        updateMusicUI(false);
      });
    }
  }

  // Start audio on first user touch/tap anywhere
  function startAudioOnFirstInteraction() {
    if (bgMusic && bgMusic.paused) {
      bgMusic.play().then(() => updateMusicUI(true)).catch(() => {});
    }
    document.removeEventListener('click', startAudioOnFirstInteraction);
    document.removeEventListener('touchstart', startAudioOnFirstInteraction);
  }
  document.addEventListener('click', startAudioOnFirstInteraction, { once: true });
  document.addEventListener('touchstart', startAudioOnFirstInteraction, { once: true });

  // Toggle button
  if (musicToggle) {
    musicToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!bgMusic) return;
      if (bgMusic.paused) {
        bgMusic.play().then(() => updateMusicUI(true)).catch(() => {});
      } else {
        bgMusic.pause();
        updateMusicUI(false);
      }
    });
  }

  // PIN Modal & Navigation
  const btnViewDetails = document.getElementById('btn-view-details');
  const pinModal = document.getElementById('pin-modal');
  const btnPinCancel = document.getElementById('btn-pin-cancel');
  const btnPinSubmit = document.getElementById('btn-pin-submit');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');

  if (btnViewDetails && window.location.search) {
    btnViewDetails.href = 'schedule.html' + window.location.search + window.location.hash;
  }

  if (btnViewDetails) {
    btnViewDetails.addEventListener('click', function(e) {
      e.preventDefault();
      if (bgMusic && bgMusic.paused) {
        bgMusic.play().then(() => updateMusicUI(true)).catch(() => {});
      }
      if (pinModal) {
        pinModal.style.display = 'flex';
        setTimeout(() => {
          if (pinInput) pinInput.focus();
        }, 100);
      }
    });
  }

  if (btnPinCancel) {
    btnPinCancel.addEventListener('click', function() {
      pinModal.style.display = 'none';
      if (pinError) pinError.style.display = 'none';
      if (pinInput) pinInput.value = '';
    });
  }

  function submitPin() {
    if (pinInput.value.trim() === '2026') {
      const hiddenLink = document.createElement('a');
      hiddenLink.href = btnViewDetails.href || 'schedule.html';
      hiddenLink.style.display = 'none';
      document.body.appendChild(hiddenLink);
      hiddenLink.click();
    } else {
      if (pinError) pinError.style.display = 'block';
    }
  }

  if (btnPinSubmit) {
    btnPinSubmit.addEventListener('click', submitPin);
  }

  if (pinInput) {
    pinInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitPin();
      }
    });
  }
});
</script>
