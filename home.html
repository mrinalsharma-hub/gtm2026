/* ── 4. Butterfly (Figma 340:174) ── */
/* ── PIXAR-LEVEL BUTTERFLY ANIMATION ── */

@keyframes wobble-fly {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(12deg); }
  75% { transform: rotate(-12deg); }
  100% { transform: rotate(0deg); }
}
@keyframes wobble-sit {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(5deg); }
  75% { transform: rotate(-5deg); }
  100% { transform: rotate(0deg); }
}

.flight-container {
  /* Animate precisely ending at 0,0 so it sits perfectly where it belongs */
  animation: swoop 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  transform-origin: center;
}

@keyframes bob {
  0%, 20%, 40%, 60%, 80% { transform: translateY(-20px); }
  10%, 30%, 50%, 70% { transform: translateY(20px); }
  90%, 100% { transform: translateY(0); }
}
.bob-container {
  /* overwrite old rule */
  animation: bob 4s ease-in-out forwards !important;
}

.old-bob-container {
  animation: bob 0.8s ease-in-out infinite alternate;
}

.wing-flap {
  width: 100%;
  height: auto;
  object-fit: contain;
  /* 2D Waggle instead of 3D flap. No size scaling, no Z-axis perspective. */
  animation: 
    wobble-fly 0.15s ease-in-out 27,
    wobble-sit 0.21s ease-in-out infinite 4.05s;
  transform-origin: center;
}

@keyframes swoop {
  0% {
    transform: translate(300px, -800px) rotate(-45deg) scale(0.3);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  30% {
    transform: translate(150px, -400px) rotate(-15deg) scale(0.6);
  }
  55% {
    /* swoop over the names (middle left) */
    transform: translate(-100px, -250px) rotate(20deg) scale(1.1);
  }
  75% {
    /* dive down */
    transform: translate(-50px, -50px) rotate(10deg) scale(0.9);
  }
  100% {
    /* land perfectly at 0,0 with original scale */
    transform: translate(0, 0) rotate(0deg) scale(1);
  }
}

@keyframes bob {
  0% { transform: translateY(-10px); }
  100% { transform: translateY(10px); }
}


  50% { transform: perspective(400px) rotateY(60deg); } /* Slightly softer flap when resting */
  100% { transform: perspective(400px) rotateY(0deg); }
}

<script>
// Preserve query parameters (e.g. guest name, passcodes) when navigating
document.addEventListener('DOMContentLoaded', function() {
  const btnViewDetails = document.getElementById('btn-view-details');
  const pinModal = document.getElementById('pin-modal');
  const btnPinCancel = document.getElementById('btn-pin-cancel');
  const btnPinSubmit = document.getElementById('btn-pin-submit');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');
  const bgMusic = document.getElementById('bg-music');
  
  let hasStartedAudio = false;
  
  if (btnViewDetails && window.location.search) {
    btnViewDetails.href = 'schedule.html' + window.location.search + window.location.hash;
  }

  btnViewDetails.addEventListener('click', function(e) {
    e.preventDefault();
    
    if (!hasStartedAudio && bgMusic) {
      bgMusic.play().then(() => {
        hasStartedAudio = true;
      }).catch(err => console.log("Audio autoplay prevented", err));
    }

    if (pinModal) {
      pinModal.style.display = 'flex';
      setTimeout(() => {
        if(pinInput) pinInput.focus();
      }, 100);
    }
  });

  if (btnPinCancel) {
    btnPinCancel.addEventListener('click', function() {
      pinModal.style.display = 'none';
      if(pinError) pinError.style.display = 'none';
      if(pinInput) pinInput.value = '';
    });
  }

  function submitPin() {
    if (pinInput.value.trim() === '2026') {
      // Correct! Navigate via PJAX simulated click to preserve audio
      const hiddenLink = document.createElement('a');
      hiddenLink.href = btnViewDetails.href || 'schedule.html';
      hiddenLink.style.display = 'none';
      document.body.appendChild(hiddenLink);
      hiddenLink.click();
    } else {
      if(pinError) pinError.style.display = 'block';
    }
  }

  if (btnPinSubmit) {
    btnPinSubmit.addEventListener('click', submitPin);
  }
  
  if (pinInput) {
    pinInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitPin();
      }
    });
  }
});

</script>
