<style>
/* ── CRITICAL EXACT STYLING FROM FIGMA NODE 340:113 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #A71F23;
  font-family: 'Cinzel', serif;
  -webkit-font-smoothing: antialiased;

}

.home-mobile-canvas {
  position: relative;
  width: 100vw;
  max-width: 440px;
  height: 100svh;
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background: #FFFFFF;
}

/* ── 1. Bg Layer (Figma 340:146) ── */
.home-bg-layer {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.home-bg-inner {
  width: 100%;
  height: 100%;
  transform: rotate(180deg);
  position: relative;
}
.home-img-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: bottom;
  opacity: 0.70;
  pointer-events: none;
}

/* ── 2. Gradient Watermark Layer (Figma 340:147) ── */
.home-gradient-layer {
  position: absolute;
  top: 121px;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 835px;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}
.home-gradient-inner {
  width: 100%;
  height: 100%;
  transform: rotate(180deg) scaleY(-1);
  position: relative;
}
.home-gradient-box {
  position: absolute;
  inset: 0;
  mix-blend-mode: soft-light;
  opacity: 0.50;
  overflow: hidden;
  pointer-events: none;
}
.home-img-gradient {
  position: absolute;
  width: 274.9%;
  height: 198.39%;
  left: -140.81%;
  top: -64.55%;
  max-width: none;
  pointer-events: none;
}

/* ── 3. Flowers Top (Figma 340:149) ── */
.home-flowers-top {

  transform: translateX(-50%);
  width: 291px;
  height: 389px;
  pointer-events: none;
  z-index: 3;
}
.home-flowers-top img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

/* ── 4. Typography Group (Figma 340:176) ── */
.home-hero-text {

  top: calc(50% + 30px);
  left: 0;
  width: 100%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 4;
  padding: 0 16px;
  pointer-events: none;
}

.home-name {

  color: #c81a1f;
  margin: 0;
  text-transform: uppercase;
}

.home-script-wrap {

  align-items: center;
  justify-content: center;

}

.home-script {

  line-height: normal;

}

.home-date-location {

}

/* ── 5. Butterfly (Figma 340:174) ── */

.home-view-details-btn:active {
