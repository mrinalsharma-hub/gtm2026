<svg xmlns="http://www.w3.org/2000/svg" viewBox="-105 -105 210 210" width="100%" height="100%" fill="none">
  <g fill="#9A2D29" stroke="#9A2D29">
    <!-- Central Hollow Diamond -->
    <path d="M 0 -18 L 18 0 L 0 18 L -18 0 Z M 0 -10.5 L -10.5 0 L 0 10.5 L 10.5 0 Z" fill="#9A2D29" stroke="none" fill-rule="evenodd"/>

    <!-- Main Diamond & 4 Corner Petal Loops -->
    <path d="
      M -48 0
      L 0 -48
      C 13 -57 14 -70 0 -78
      C -14 -70 -13 -57 0 -48
      L 48 0
      C 57 13 70 14 78 0
      C 70 -14 57 -13 48 0
      L 0 48
      C -13 57 -14 70 0 78
      C 14 70 13 57 0 48
      L -48 0
      C -57 -13 -70 -14 -78 0
      C -70 14 -57 13 -48 0
      Z" 
      fill="none" 
      stroke="#9A2D29" 
      stroke-width="5.6" 
      stroke-linecap="round" 
      stroke-linejoin="round"/>

    <!-- 4 Cardinal Outer Dots -->
    <circle cx="0" cy="-91.5" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="91.5" cy="0" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="0" cy="91.5" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="-91.5" cy="0" r="3.8" fill="#9A2D29" stroke="none"/>

    <!-- 4 Diagonal Corner Ornaments (Dots & Teardrops) -->
    <!-- Top-Right (NE) -->
    <g transform="rotate(0)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 36 -30 C 43 -27 49 -33 46 -37 C 43 -41 37 -35 36 -30 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 30 -36 C 35 -37 41 -43 37 -46 C 33 -49 27 -43 30 -36 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- Bottom-Right (SE) -->
    <g transform="rotate(90)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 36 -30 C 43 -27 49 -33 46 -37 C 43 -41 37 -35 36 -30 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 30 -36 C 35 -37 41 -43 37 -46 C 33 -49 27 -43 30 -36 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- Bottom-Left (SW) -->
    <g transform="rotate(180)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 36 -30 C 43 -27 49 -33 46 -37 C 43 -41 37 -35 36 -30 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 30 -36 C 35 -37 41 -43 37 -46 C 33 -49 27 -43 30 -36 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- Top-Left (NW) -->
    <g transform="rotate(270)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 36 -30 C 43 -27 49 -33 46 -37 C 43 -41 37 -35 36 -30 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 30 -36 C 35 -37 41 -43 37 -46 C 33 -49 27 -43 30 -36 Z" fill="#9A2D29" stroke="none"/>
    </g>
