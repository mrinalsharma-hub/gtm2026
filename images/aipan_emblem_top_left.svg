<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="100%" height="100%" fill="none">
  <g fill="#9A2D29" stroke="#9A2D29">
    <!-- Center Concentric Hollow Diamond -->
    <path d="M 0 -18 L 18 0 L 0 18 L -18 0 Z M 0 -9.5 L -9.5 0 L 0 9.5 L 9.5 0 Z" fill="#9A2D29" stroke="none" fill-rule="evenodd"/>

    <!-- Main Diamond & 4 Interlocking Dhoka/Petal Loops -->
    <path d="
      M -48 0
      L 0 -48
      C 13 -57 14 -70 0 -78
      C -14 -70 -13 -57 0 -48
      L 48 0
      C 57 13 70 14 78 0
      C 70 -14 57 -13 48 0
      L 0 48
      C -13 57 -14 70 0 78
      C 14 70 13 57 0 48
      L -48 0
      C -57 -13 -70 -14 -78 0
      C -70 14 -57 13 -48 0
      Z" 
      fill="none" 
      stroke="#9A2D29" 
      stroke-width="5.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"/>

    <!-- 4 Cardinal Outer Bindu Dots -->
    <circle cx="0" cy="-91.5" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="91.5" cy="0" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="0" cy="91.5" r="3.8" fill="#9A2D29" stroke="none"/>
    <circle cx="-91.5" cy="0" r="3.8" fill="#9A2D29" stroke="none"/>

    <!-- 4 Quadrants Diagonal Ornaments (Rice-Grain Teardrops & Framing Dots) -->
    <!-- NE (0 deg) -->
    <g transform="rotate(0)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 35.5 -29.5 C 42.5 -26.5 49 -32.5 46 -37 C 43 -41.5 37 -35 35.5 -29.5 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 29.5 -35.5 C 35 -37 41.5 -43 37 -46 C 32.5 -49 26.5 -42.5 29.5 -35.5 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- SE (90 deg) -->
    <g transform="rotate(90)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 35.5 -29.5 C 42.5 -26.5 49 -32.5 46 -37 C 43 -41.5 37 -35 35.5 -29.5 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 29.5 -35.5 C 35 -37 41.5 -43 37 -46 C 32.5 -49 26.5 -42.5 29.5 -35.5 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- SW (180 deg) -->
    <g transform="rotate(180)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 35.5 -29.5 C 42.5 -26.5 49 -32.5 46 -37 C 43 -41.5 37 -35 35.5 -29.5 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 29.5 -35.5 C 35 -37 41.5 -43 37 -46 C 32.5 -49 26.5 -42.5 29.5 -35.5 Z" fill="#9A2D29" stroke="none"/>
    </g>

    <!-- NW (270 deg) -->
    <g transform="rotate(270)">
      <circle cx="45" cy="-45" r="2.8" fill="#9A2D29" stroke="none"/>
      <circle cx="53.5" cy="-53.5" r="2.8" fill="#9A2D29" stroke="none"/>
      <path d="M 35.5 -29.5 C 42.5 -26.5 49 -32.5 46 -37 C 43 -41.5 37 -35 35.5 -29.5 Z" fill="#9A2D29" stroke="none"/>
      <path d="M 29.5 -35.5 C 35 -37 41.5 -43 37 -46 C 32.5 -49 26.5 -42.5 29.5 -35.5 Z" fill="#9A2D29" stroke="none"/>
    </g>
  </g>
</svg>