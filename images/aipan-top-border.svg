<svg width="100%" height="25.2" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="aipan-dots-band" width="25.2" height="25.2" patternUnits="userSpaceOnUse">
      <!-- 1. Top Horizontal Line (y = 1.6) -->
      <line x1="0" y1="1.6" x2="25.2" y2="1.6" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 2. Row of Large Pearl Dots (Bindus) - 2 per 25.2px unit (spaced every 12.6px) -->
      <circle cx="6.3" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 3. Double Horizontal Guideline Rule Lines -->
      <line x1="0" y1="14.2" x2="25.2" y2="14.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>
      <line x1="0" y1="17.3" x2="25.2" y2="17.3" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 4. Bottom Row of Fine Micro-Dots - 6 per 25.2px unit (spaced every 4.2px) -->
      <circle cx="2.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="6.3" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="10.5" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="14.7" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="23.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aipan-dots-band)"/>
</svg>
