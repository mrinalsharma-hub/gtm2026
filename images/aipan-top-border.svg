<svg width="100%" height="52.4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="aipan-top-border-pattern" width="25.2" height="52.4" patternUnits="userSpaceOnUse">
      <!-- ══════════════════════════════════════════════════
           UPPER SECTION: Full Original Authentic Aipan Border
           ══════════════════════════════════════════════════ -->
      <!-- 1. Top Horizontal Line (y = 1.6) -->
      <line x1="0" y1="1.6" x2="25.2" y2="1.6" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 2. Row of Large Pearl Dots (Bindus) - 2 per 25.2px unit (spaced every 12.6px) -->
      <circle cx="6.3" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 3. Double Horizontal Guideline Rule Lines -->
      <line x1="0" y1="14.2" x2="25.2" y2="14.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>
      <line x1="0" y1="17.3" x2="25.2" y2="17.3" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 4. Bottom Row of Fine Micro-Dots - 6 per 25.2px unit (spaced every 4.2px) -->
      <circle cx="2.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="6.3" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="10.5" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="14.7" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="23.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 5. Baseline Rule Line (y = 25.2) -->
      <line x1="0" y1="25.2" x2="25.2" y2="25.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- ══════════════════════════════════════════════════
           LOWER SECTION: 2px Padding below Line + 10% Smaller Motif
           ══════════════════════════════════════════════════ -->
      <!-- 5-Stroke Cascading Vasudhara Fingers (Tassels) -->
      <path d="M 4.20 27.20 C 2.92 30.46, 2.78 33.07, 2.83 35.03 C 3.06 37.38, 3.77 39.21, 4.20 40.25 C 4.63 39.21, 5.34 37.38, 5.57 35.03 C 5.62 33.07, 5.48 30.46, 4.20 27.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 8.40 27.20 C 7.12 31.14, 6.98 34.29, 7.03 36.65 C 7.26 39.48, 7.97 41.69, 8.40 42.95 C 8.83 41.69, 9.54 39.48, 9.77 36.65 C 9.83 34.29, 9.68 31.14, 8.40 27.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 12.60 27.20 C 11.23 31.81, 11.07 35.50, 11.14 38.27 C 11.38 41.59, 12.14 44.17, 12.60 45.65 C 13.06 44.17, 13.82 41.59, 14.06 38.27 C 14.12 35.50, 13.97 31.81, 12.60 27.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 16.80 27.20 C 15.52 31.14, 15.38 34.29, 15.43 36.65 C 15.66 39.48, 16.37 41.69, 16.80 42.95 C 17.23 41.69, 17.94 39.48, 18.17 36.65 C 18.23 34.29, 18.08 31.14, 16.80 27.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 21.00 27.20 C 19.72 30.46, 19.57 33.07, 19.63 35.03 C 19.86 37.38, 20.57 39.21, 21.00 40.25 C 21.43 39.21, 22.14 37.38, 22.37 35.03 C 22.43 33.07, 22.28 30.46, 21.00 27.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 5 Chevron Pearl Dots (Bindus) in Descending V-Formation -->
      <circle cx="4.20" cy="43.13" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="8.40" cy="45.83" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="12.60" cy="48.53" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="16.80" cy="45.83" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="21.00" cy="43.13" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aipan-top-border-pattern)"/>
</svg>
