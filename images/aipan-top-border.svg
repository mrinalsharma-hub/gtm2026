      <line x1="0" y1="25.2" x2="50.4" y2="25.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- ══════════════════════════════════════════════════
           LOWER SECTION: Appended 5-Stroke Vasudhara Tassels & Chevron Bindus
           ══════════════════════════════════════════════════ -->
      <path d="M 10.80 25.20 C 9.36 28.82, 9.20 31.73, 9.26 33.90 C 9.52 36.51, 10.32 38.54, 10.80 39.70 C 11.28 38.54, 12.08 36.51, 12.34 33.90 C 12.40 31.73, 12.24 28.82, 10.80 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 18.00 25.20 C 16.56 29.57, 16.40 33.08, 16.46 35.70 C 16.72 38.85, 17.52 41.30, 18.00 42.70 C 18.48 41.30, 19.28 38.85, 19.54 35.70 C 19.60 33.08, 19.44 29.57, 18.00 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 25.20 25.20 C 23.67 30.32, 23.50 34.42, 23.57 37.50 C 23.84 41.19, 24.69 44.06, 25.20 45.70 C 25.71 44.06, 26.56 41.19, 26.83 37.50 C 26.90 34.42, 26.73 30.32, 25.20 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 32.40 25.20 C 30.96 29.57, 30.80 33.08, 30.86 35.70 C 31.12 38.85, 31.92 41.30, 32.40 42.70 C 32.88 41.30, 33.68 38.85, 33.94 35.70 C 34.00 33.08, 33.84 29.57, 32.40 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 39.60 25.20 C 38.16 28.82, 38.00 31.73, 38.06 33.90 C 38.32 36.51, 39.12 38.54, 39.60 39.70 C 40.08 38.54, 40.88 36.51, 41.14 33.90 C 41.20 31.73, 41.04 28.82, 39.60 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>

      <circle cx="10.80" cy="42.90" r="1.60" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.00" cy="45.90" r="1.60" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="25.20" cy="48.90" r="1.60" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="32.40" cy="45.90" r="1.60" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="39.60" cy="42.90" r="1.60" fill="#FFFFFF" fill-opacity="0.95"/>
