<svg width="100%" height="50.4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="aipan-top-border-pattern" width="25.2" height="50.4" patternUnits="userSpaceOnUse">
      <!-- ══════════════════════════════════════════════════
           UPPER SECTION: Full Original Authentic Aipan Border
           ══════════════════════════════════════════════════ -->
      <!-- 1. Top Horizontal Line (y = 1.6) -->
      <line x1="0" y1="1.6" x2="25.2" y2="1.6" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 2. Row of Large Pearl Dots (Bindus) - 2 per 25.2px unit (spaced every 12.6px) -->
      <circle cx="6.3" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="7.9" r="3.36" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 3. Double Horizontal Guideline Rule Lines -->
      <line x1="0" y1="14.2" x2="25.2" y2="14.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>
      <line x1="0" y1="17.3" x2="25.2" y2="17.3" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 4. Bottom Row of Fine Micro-Dots - 6 per 25.2px unit (spaced every 4.2px) -->
      <circle cx="2.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="6.3" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="10.5" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="14.7" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18.9" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="23.1" cy="21.5" r="1.05" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 5. Baseline Rule Line (y = 25.2) -->
      <line x1="0" y1="25.2" x2="25.2" y2="25.2" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- ══════════════════════════════════════════════════
           LOWER SECTION: 10% Smaller & Closer Together Motif Clusters
           ══════════════════════════════════════════════════ -->
      <!-- 5-Stroke Cascading Vasudhara Fingers (Tassels) -->
      <path d="M 4.20 25.20 C 2.92 28.46, 2.78 31.07, 2.83 33.03 C 3.06 35.38, 3.77 37.21, 4.20 38.25 C 4.63 37.21, 5.34 35.38, 5.57 33.03 C 5.62 31.07, 5.48 28.46, 4.20 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 8.40 25.20 C 7.12 29.14, 6.98 32.29, 7.03 34.65 C 7.26 37.48, 7.97 39.69, 8.40 40.95 C 8.83 39.69, 9.54 37.48, 9.77 34.65 C 9.83 32.29, 9.68 29.14, 8.40 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 12.60 25.20 C 11.23 29.81, 11.07 33.50, 11.14 36.27 C 11.38 39.59, 12.14 42.17, 12.60 43.65 C 13.06 42.17, 13.82 39.59, 14.06 36.27 C 14.12 33.50, 13.97 29.81, 12.60 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 16.80 25.20 C 15.52 29.14, 15.38 32.29, 15.43 34.65 C 15.66 37.48, 16.37 39.69, 16.80 40.95 C 17.23 39.69, 17.94 37.48, 18.17 34.65 C 18.23 32.29, 18.08 29.14, 16.80 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M 21.00 25.20 C 19.72 28.46, 19.57 31.07, 19.63 33.03 C 19.86 35.38, 20.57 37.21, 21.00 38.25 C 21.43 37.21, 22.14 35.38, 22.37 33.03 C 22.43 31.07, 22.28 28.46, 21.00 25.20 Z" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 5 Chevron Pearl Dots (Bindus) in Descending V-Formation -->
      <circle cx="4.20" cy="41.13" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="8.40" cy="43.83" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="12.60" cy="46.53" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="16.80" cy="43.83" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="21.00" cy="41.13" r="1.44" fill="#FFFFFF" fill-opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aipan-top-border-pattern)"/>
</svg>
