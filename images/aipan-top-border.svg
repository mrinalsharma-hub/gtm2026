<svg width="100%" height="24" viewBox="0 0 480 24" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="aipan-dots-band" width="24" height="24" patternUnits="userSpaceOnUse">
      <!-- 1. Top Thin Horizontal Rule Line -->
      <line x1="0" y1="1.5" x2="24" y2="1.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 2. Row of Prominent White Pearl Dots (Bindus) -->
      <circle cx="6" cy="7.5" r="3.2" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18" cy="7.5" r="3.2" fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- 3. Double Horizontal Guideline Rule Lines -->
      <line x1="0" y1="13.5" x2="24" y2="13.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>
      <line x1="0" y1="16.5" x2="24" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.95"/>

      <!-- 4. Bottom Row of Fine Micro-Dots -->
      <circle cx="2" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="6" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="10" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="14" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="18" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="22" cy="20.5" r="1" fill="#FFFFFF" fill-opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="100%" height="24" fill="url(#aipan-dots-band)"/>
</svg>
