<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 240" width="2400" height="240" preserveAspectRatio="none">
  <defs>
    <style>
      .aipan-bold  { fill: #FFFFFF; }
      .aipan-line  { stroke: #FFFFFF; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .aipan-thick { stroke: #FFFFFF; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .aipan-fine  { stroke: #FFFFFF; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .geru-cut    { fill: #A71F23; }
    </style>
  </defs>

  <!-- =========================================================================
       TILE 1 (0 to 1200px)
       ========================================================================= -->
  <g id="tile-1">
    <!-- Double Bold Baseline Ground Borders -->
    <line class="aipan-thick" x1="0" y1="210" x2="1200" y2="210" />
    <line class="aipan-line"  x1="0" y1="222" x2="1200" y2="222" />

    <!-- Himalayan Chevron Border (Kinery) running along entire baseline -->
    <path class="aipan-line" d="
      M 0 210 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
      l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14 l 12 -14 l 12 14
    " />

    <!-- Big Sacred Bindu Dots below baseline -->
    <g class="aipan-bold">
      <circle cx="20" cy="232" r="3"/><circle cx="60" cy="232" r="3"/><circle cx="100" cy="232" r="3"/><circle cx="140" cy="232" r="3"/>
      <circle cx="180" cy="232" r="3"/><circle cx="220" cy="232" r="3"/><circle cx="260" cy="232" r="3"/><circle cx="300" cy="232" r="3"/>
      <circle cx="340" cy="232" r="3"/><circle cx="380" cy="232" r="3"/><circle cx="420" cy="232" r="3"/><circle cx="460" cy="232" r="3"/>
      <circle cx="500" cy="232" r="3"/><circle cx="540" cy="232" r="3"/><circle cx="580" cy="232" r="3"/><circle cx="620" cy="232" r="3"/>
      <circle cx="660" cy="232" r="3"/><circle cx="700" cy="232" r="3"/><circle cx="740" cy="232" r="3"/><circle cx="780" cy="232" r="3"/>
      <circle cx="820" cy="232" r="3"/><circle cx="860" cy="232" r="3"/><circle cx="900" cy="232" r="3"/><circle cx="940" cy="232" r="3"/>
      <circle cx="980" cy="232" r="3"/><circle cx="1020" cy="232" r="3"/><circle cx="1060" cy="232" r="3"/><circle cx="1100" cy="232" r="3"/>
      <circle cx="1140" cy="232" r="3"/><circle cx="1180" cy="232" r="3"/>
    </g>


    <!-- =======================================================================
         MOTIF 1: GIANT RANSINGHA TRUMPETER (Leading Parade Leftward x = 70)
         ======================================================================= -->
    <g transform="translate(60, 0)">
      <!-- Head Turban & Face Profile -->
      <circle class="aipan-bold" cx="45" cy="85" r="14"/>
      <!-- Pointed Turban Crown -->
      <path class="aipan-bold" d="M 33 76 L 57 76 L 45 52 Z" />
      <!-- Hourglass Aipan Body -->
      <path class="aipan-bold" d="M 32 98 L 58 98 L 49 140 L 59 210 L 31 210 L 41 140 Z" />
      <line class="aipan-fine" x1="34" y1="160" x2="56" y2="160" />
      <line class="aipan-fine" x1="33" y1="180" x2="57" y2="180" />

      <!-- Giant Sweeping Crescent Copper Ransingha Trumpet blowing into sky -->
      <path class="aipan-thick" d="M 45 88 C 15 70 5 25 35 8 C 72 -10 115 15 105 52 C 98 78 75 88 55 88" />
      <ellipse class="aipan-bold" cx="105" cy="50" rx="14" ry="7" transform="rotate(-25 105 50)" />
      <!-- Fanfare Sound Rays bursting from horn -->
      <line class="aipan-line" x1="116" y1="42" x2="140" y2="28" />
      <line class="aipan-line" x1="120" y1="52" x2="148" y2="52" />
      <line class="aipan-line" x1="116" y1="62" x2="140" y2="76" />
      <circle class="aipan-bold" cx="146" cy="25" r="4"/>
      <circle class="aipan-bold" cx="154" cy="52" r="4"/>
      <circle class="aipan-bold" cx="146" cy="79" r="4"/>
    </g>


    <!-- =======================================================================
         MOTIF 2: DHOL-DAMAU DRUMMER (x = 210)
         ======================================================================= -->
    <g transform="translate(195, 0)">
      <!-- Head Turban -->
      <circle class="aipan-bold" cx="45" cy="88" r="13"/>
      <path class="aipan-bold" d="M 34 80 L 56 80 L 45 60 Z" />
      <!-- Torso & Skirt -->
      <path class="aipan-bold" d="M 33 100 L 57 100 L 48 142 L 58 210 L 32 210 L 42 142 Z" />
      <!-- Giant Barrel Dhol Drum slung low -->
      <ellipse class="aipan-bold" cx="24" cy="148" rx="24" ry="34" transform="rotate(-15 24 148)" />
      <!-- Inner geometric diamond pattern on drum shell -->
      <ellipse class="aipan-fine" cx="24" cy="148" rx="17" ry="26" stroke="#A71F23" stroke-width="3" fill="none" transform="rotate(-15 24 148)" />
      <line class="aipan-fine" x1="8" y1="128" x2="40" y2="168" />
      <line class="aipan-fine" x1="40" y1="128" x2="8" y2="168" />
      <!-- Raised Drumsticks -->
      <line class="aipan-line" x1="48" y1="110" x2="22" y2="122" />
      <line class="aipan-line" x1="50" y1="115" x2="26" y2="172" />
      <circle class="aipan-bold" cx="20" cy="122" r="5"/>
      <circle class="aipan-bold" cx="25" cy="174" r="5"/>
    </g>


    <!-- =======================================================================
         MOTIF 3: SECOND DRUMMER / BHANKORA PLAYER (x = 330)
         ======================================================================= -->
    <g transform="translate(320, 0)">
      <circle class="aipan-bold" cx="45" cy="88" r="13"/>
      <path class="aipan-bold" d="M 34 80 L 56 80 L 45 60 Z" />
      <path class="aipan-bold" d="M 33 100 L 57 100 L 48 142 L 58 210 L 32 210 L 42 142 Z" />
      <!-- Hourglass Hurka drum -->
      <path class="aipan-bold" d="M 12 124 L 38 124 L 25 146 L 38 168 L 12 168 L 25 146 Z" />
      <circle class="aipan-bold" cx="25" cy="146" r="4"/>
    </g>


    <!-- Aipan Sacred Mandala Lotus Centerpiece Separator (x = 460) -->
    <g transform="translate(460, 125)">
      <circle class="aipan-bold" cx="0" cy="0" r="18"/>
      <circle class="aipan-line" cx="0" cy="0" r="28"/>
      <!-- Sun rays / Lotus petals -->
      <path class="aipan-bold" d="M 0 -36 L 7 -26 L -7 -26 Z" />
      <path class="aipan-bold" d="M 36 0 L 26 7 L 26 -7 Z" />
      <path class="aipan-bold" d="M 0 36 L 7 26 L -7 26 Z" />
      <path class="aipan-bold" d="M -36 0 L -26 7 L -26 -7 Z" />
      <path class="aipan-bold" d="M 25 -25 L 24 -14 L 14 -24 Z" />
      <path class="aipan-bold" d="M 25 25 L 24 14 L 14 24 Z" />
      <path class="aipan-bold" d="M -25 25 L -24 14 L -14 24 Z" />
      <path class="aipan-bold" d="M -25 -25 L -24 -14 L -14 -24 Z" />
    </g>


    <!-- =======================================================================
         MOTIF 4: CAPARISONED KUMAONI WEDDING HORSE & DULHA (GROOM) (x = 590)
         ======================================================================= -->
    <g transform="translate(540, 0)">
      <!-- Royal Parasol Chhatra overhead -->
      <path class="aipan-bold" d="M 90 28 C 90 4 170 4 170 28 Z" />
      <line class="aipan-thick" x1="130" y1="28" x2="130" y2="120" />
      <circle class="aipan-bold" cx="130" cy="-2" r="6"/>
      <circle class="aipan-bold" cx="95" cy="33" r="3"/>
      <circle class="aipan-bold" cx="112" cy="35" r="3"/>
      <circle class="aipan-bold" cx="130" cy="36" r="3"/>
      <circle class="aipan-bold" cx="148" cy="35" r="3"/>
      <circle class="aipan-bold" cx="165" cy="33" r="3"/>

      <!-- Turbaned Groom with Crown Mukut sitting tall -->
      <circle class="aipan-bold" cx="128" cy="65" r="14"/>
      <!-- Pointed Kumaoni Wedding Crown Mukut -->
      <path class="aipan-bold" d="M 115 54 L 141 54 L 128 32 Z" />
      <!-- Groom Torso -->
      <path class="aipan-bold" d="M 114 78 L 142 78 L 132 128 L 120 128 Z" />
      <!-- Sword in groom's hand -->
      <line class="aipan-thick" x1="140" y1="88" x2="165" y2="60" />

      <!-- Caparisoned Steed (Horse) -->
      <!-- Horse Body Block -->
      <path class="aipan-bold" d="M 65 145 C 65 125 105 125 160 135 C 185 125 198 95 190 65 C 180 50 166 52 158 68 C 150 82 154 105 165 120 C 120 120 85 125 65 145 Z" />
      <!-- Caparisoned Saddle Blanket Hatch -->
      <path class="aipan-line" d="M 90 135 L 90 170 M 110 135 L 110 170 M 130 135 L 130 170 M 150 135 L 150 170" />
      <!-- Four Strong Horse Legs extending to Ground -->
      <polygon class="aipan-bold" points="68,160 78,160 84,210 70,210" />
      <polygon class="aipan-bold" points="92,160 102,160 108,210 94,210" />
      <polygon class="aipan-bold" points="142,160 152,160 156,210 142,210" />
      <polygon class="aipan-bold" points="166,160 176,160 180,210 166,210" />
      <!-- Arched Plumed Crest on horse ears -->
      <path class="aipan-bold" d="M 185 55 C 190 38 200 35 205 38 C 200 48 192 58 185 65 Z" />
    </g>


    <!-- Flying Sparrows / Peacocks overhead (x = 760) -->
    <g transform="translate(775, 45)">
      <path class="aipan-bold" d="M 0 0 C 14 -16 28 -12 36 -2 C 44 -12 58 -16 72 0 C 50 4 36 18 36 18 C 36 18 22 4 0 0 Z" />
      <circle class="aipan-bold" cx="36" cy="-2" r="3"/>
    </g>


    <!-- =======================================================================
         MOTIF 5: THE GRAND KUMAONI BRIDAL DOLI / PALKI & FOUR BEARERS (x = 880)
         ======================================================================= -->
    <g transform="translate(850, 0)">
      <!-- Long Heavy Bamboo Carrying Pole slung on shoulders -->
      <rect class="aipan-bold" x="0" y="118" width="340" height="9" rx="4" />

      <!-- FRONT BEARER 1 (x = 25) -->
      <g transform="translate(20, 0)">
        <circle class="aipan-bold" cx="20" cy="94" r="12"/>
        <path class="aipan-bold" d="M 10 86 L 30 86 L 20 68 Z" />
        <path class="aipan-bold" d="M 8 106 L 32 106 L 24 148 L 32 210 L 8 210 L 16 148 Z" />
      </g>
      <!-- FRONT BEARER 2 (x = 65) -->
      <g transform="translate(60, 0)">
        <circle class="aipan-bold" cx="20" cy="94" r="12"/>
        <path class="aipan-bold" d="M 10 86 L 30 86 L 20 68 Z" />
        <path class="aipan-bold" d="M 8 106 L 32 106 L 24 148 L 32 210 L 8 210 L 16 148 Z" />
      </g>

      <!-- ===================================================================
           SACRED KUMAONI DOLI CABIN (x = 115 to 225)
           =================================================================== -->
      <g transform="translate(115, 0)">
        <!-- Tiered Pagoda Roof -->
        <path class="aipan-bold" d="M 5 106 C 25 60 95 60 115 106 Z" />
        <!-- Main Cabin Block -->
        <rect class="aipan-bold" x="0" y="106" width="120" height="64" rx="4" />
        <!-- Inner Cutout Window frame showing deep geru background -->
        <rect class="geru-cut" x="18" y="116" width="84" height="44" rx="6" />
        <rect class="aipan-line" x="18" y="116" width="84" height="44" rx="6" />

        <!-- Profile Silhouette of Kumaoni Bride (Dulhan) in Pichhaura Nath -->
        <circle class="aipan-bold" cx="60" cy="132" r="11"/>
        <!-- Large Bridal Nath Nose Ring -->
        <circle class="aipan-line" cx="52" cy="134" r="7"/>
        <!-- Rangwali Pichhaura Dotted Shawl Silhouette -->
        <path class="aipan-bold" d="M 46 143 C 44 160 76 160 74 143 Z" />
        <g class="aipan-bold">
          <circle cx="53" cy="149" r="1.5"/><circle cx="60" cy="151" r="1.5"/><circle cx="67" cy="149" r="1.5"/>
        </g>

        <!-- Top Sacred Kalash Finial on Doli Roof -->
        <path class="aipan-bold" d="M 60 62 L 60 44" />
        <circle class="aipan-bold" cx="60" cy="38" r="7"/>
        <path class="aipan-bold" d="M 50 62 L 70 62 L 60 48 Z" />

        <!-- Hanging Lotus Bells along Doli base -->
        <circle class="aipan-bold" cx="12" cy="180" r="4"/>
        <line class="aipan-fine" x1="12" y1="170" x2="12" y2="176" />
        <circle class="aipan-bold" cx="36" cy="182" r="4"/>
        <line class="aipan-fine" x1="36" y1="170" x2="36" y2="178" />
        <circle class="aipan-bold" cx="60" cy="185" r="5"/>
        <line class="aipan-fine" x1="60" y1="170" x2="60" y2="180" />
        <circle class="aipan-bold" cx="84" cy="182" r="4"/>
        <line class="aipan-fine" x1="84" y1="170" x2="84" y2="178" />
        <circle class="aipan-bold" cx="108" cy="180" r="4"/>
        <line class="aipan-fine" x1="108" y1="170" x2="108" y2="176" />
      </g>

      <!-- REAR BEARER 3 (x = 245) -->
      <g transform="translate(240, 0)">
        <circle class="aipan-bold" cx="20" cy="94" r="12"/>
        <path class="aipan-bold" d="M 10 86 L 30 86 L 20 68 Z" />
        <path class="aipan-bold" d="M 8 106 L 32 106 L 24 148 L 32 210 L 8 210 L 16 148 Z" />
      </g>
      <!-- REAR BEARER 4 (x = 285) -->
      <g transform="translate(280, 0)">
        <circle class="aipan-bold" cx="20" cy="94" r="12"/>
        <path class="aipan-bold" d="M 10 86 L 30 86 L 20 68 Z" />
        <path class="aipan-bold" d="M 8 106 L 32 106 L 24 148 L 32 210 L 8 210 L 16 148 Z" />
      </g>
    </g>


    <!-- Auspicious Diya Lamp Motif near Tile end (x = 1140) -->
    <g transform="translate(1140, 175)">
      <path class="aipan-bold" d="M -16 12 C -16 -4 16 -4 16 12 Z" />
      <!-- Flame -->
      <path class="aipan-bold" d="M 0 -6 C -6 -18 0 -30 0 -30 C 0 -30 6 -18 0 -6 Z" />
    </g>
  </g> <!-- END TILE 1 -->


  <!-- =========================================================================
       TILE 2 (EXACT DUPLICATE SEAMLESS OFFSET AT x = 1200px)
       Guarantees 100% infinite smooth CSS loop from translateX(0) to translateX(-1200px)
       ========================================================================= -->
  <use href="#tile-1" x="1200" y="0" />
</svg>
