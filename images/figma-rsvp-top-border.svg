<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="24" viewBox="0 0 400 24" preserveAspectRatio="none">
  <defs>
    <pattern id="toran-fringe" width="18" height="24" patternUnits="userSpaceOnUse">
      <!-- Top line -->
      <line x1="0" y1="2" x2="18" y2="2" stroke="#FFF6E8" stroke-width="1.5" stroke-opacity="0.85"/>
      <!-- Hanging fringe lines -->
      <line x1="2" y1="4" x2="2" y2="9" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <line x1="4.5" y1="4" x2="4.5" y2="12" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <line x1="7" y1="4" x2="7" y2="14.5" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <line x1="9" y1="4" x2="9" y2="16.5" stroke="#FFF6E8" stroke-width="1.4" stroke-opacity="0.95" stroke-linecap="round"/>
      <line x1="11" y1="4" x2="11" y2="14.5" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <line x1="13.5" y1="4" x2="13.5" y2="12" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <line x1="16" y1="4" x2="16" y2="9" stroke="#FFF6E8" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round"/>
      <!-- Bottom pointed dot -->
      <circle cx="9" cy="19.5" r="1.1" fill="#FFF6E8" fill-opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="100%" height="24" fill="url(#toran-fringe)" />
</svg>
