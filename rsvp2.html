<div class="rsvp-bg-layer" aria-hidden="true"></div>

<!-- ── 2. RSVP Main Scrollable Wrapper ── -->
<main class="rsvp-page-wrap">
  <!-- Centered Hero Header -->
  <header class="rsvp-hero-header">
    <div class="rsvp-mandala-wrap">
      <img src="images/mandala-flower.svg" alt="Mandala" class="rsvp-mandala-img" width="120" height="120">
    </div>
    <h1 class="rsvp-title">RSVP</h1>
    <p class="rsvp-subtitle">Help us finalize our celebrations!</p>
  </header>

  <!-- Parchment Card Container -->
  <div class="rsvp-card-container">
    <section class="card rsvp-card">
      <div id="rsvp-thanks">
        <p class="big">Thank you</p>
        <p class="sub">Your response has reached us safely.<br>We can't wait to celebrate with you.</p>
        <a class="btn btn-red" href="travel.html">Plan your trip</a>
      </div>

      <form id="rsvp-form" novalidate>
        <div class="fgroup">
          <label class="flabel" for="name-1">Name(s)</label>
          <div id="name-list">
            <div class="name-row">
              <input type="text" class="finput name-input" id="name-1" placeholder="Please enter your full name" autocomplete="name">
            </div>
          </div>
          <button type="button" id="add-person" class="add-link">+ Add another person</button>
        </div>

        <div class="fgroup">
          <span class="flabel">Will you be joining us?</span>
          <div class="opt-rows">
            <label class="opt-row">
              <input type="radio" name="attending" value="Joyfully accept">
              <span class="mark radio"></span>
              <span class="opt-text"><strong>Yes,</strong> can&rsquo;t wait!</span>
            </label>
            <label class="opt-row">
              <input type="radio" name="attending" value="Regretfully decline">
              <span class="mark radio"></span>
              <span class="opt-text"><strong>Sorry,</strong> can&rsquo;t make it!</span>
            </label>
          </div>
        </div>

        <div class="fgroup">
          <label class="flabel" for="f-contact">Phone or email</label>
          <input type="text" id="f-contact" class="finput" placeholder="In case we want to reach you" autocomplete="email">
        </div>

        <div class="fgroup">
          <span class="flabel">Which celebrations will you attend?</span>
          <div class="opt-rows">
            <label class="opt-row">
              <input type="checkbox" name="events" value="Mehndi Night · Fri Nov 20, 2026 (optional)">
              <span class="mark check"></span>
              <span class="opt-text"><strong>Mehndi Night</strong>&ensp;Fri Nov 20, 2026 (optional)</span>
            </label>
            <label class="opt-row">

<script>
/* ── RSVP → Google Form bridge ─────────────────────────────
   Responses land in the Google Form (and its linked Sheet).
   Checkbox values must match the Form's option strings exactly. */
var RSVP_CONFIG={
  formId:"1FAIpQLSfeO8PSZsK5uh-BZzMEa5SIlpMaKwp1fx9R5dhrdmgSYiibVg",
  entries:{
    name:"entry.874918285",
    contact:"entry.2141331214",
    attending:"entry.1260390804",
    guests:"entry.530695183",
    events:"entry.1296232095",
    dietary:"entry.154148020",
    message:"entry.1246319647"
  }
};

(function(){
  var form=document.getElementById('rsvp-form'),
      status=document.getElementById('rsvp-status'),
      thanks=document.getElementById('rsvp-thanks'),
      list=document.getElementById('name-list'),
      addBtn=document.getElementById('add-person'),
      MAX_NAMES=8;

  addBtn.addEventListener('click',function(){
    var count=list.querySelectorAll('.name-input').length;
    if(count>=MAX_NAMES)return;
    var row=document.createElement('div');
    row.className='name-row';
    row.innerHTML='<input type="text" class="finput name-input" placeholder="Please enter their full name">'+
                  '<button type="button" class="rm" aria-label="Remove this person">&#10005;</button>';
    list.appendChild(row);
    row.querySelector('.rm').addEventListener('click',function(){row.remove()});
    row.querySelector('input').focus();
    if(list.querySelectorAll('.name-input').length>=MAX_NAMES)addBtn.style.display='none';
  });
  list.addEventListener('click',function(){
    if(list.querySelectorAll('.name-input').length<MAX_NAMES)addBtn.style.display='';
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var names=[].slice.call(form.querySelectorAll('.name-input'))
                .map(function(i){return i.value.trim()})
                .filter(Boolean),
        contact=form.querySelector('#f-contact').value.trim(),
        attending=form.querySelector('input[name=attending]:checked');
    if(!names.length||!contact||!attending){
      status.textContent='Please fill in your name, contact and whether you can join us.';
      return;
    }
    var p=new URLSearchParams();
    p.append(RSVP_CONFIG.entries.name,names.join(', '));
    p.append(RSVP_CONFIG.entries.contact,contact);
    p.append(RSVP_CONFIG.entries.attending,attending.value);
    p.append(RSVP_CONFIG.entries.guests,String(names.length));
    form.querySelectorAll('input[name=events]:checked').forEach(function(c){
      p.append(RSVP_CONFIG.entries.events,c.value);
    });
    var diet=form.querySelector('#f-diet').value.trim(),
        msg=form.querySelector('#f-msg').value.trim();
    if(diet)p.append(RSVP_CONFIG.entries.dietary,diet);
    if(msg)p.append(RSVP_CONFIG.entries.message,msg);

    status.textContent='Sending…';
    fetch('https://docs.google.com/forms/d/e/'+RSVP_CONFIG.formId+'/formResponse',{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:p.toString()
    }).then(function(){
      form.style.display='none';
      thanks.style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    }).catch(function(){
      status.textContent='Something went wrong — please try again, or write to us directly.';
    });
  });
})();
</script>

<script>
// Native app scroll clamp to prevent browser address bar auto-hiding
(function() {
  var scroller = document.querySelector('main');
  if (!scroller) return;

  // 1. Boundary Clamping on touchstart:
  // When at top (0px) or bottom (max), offset by 1px so the drag gesture is always consumed internally by the scroller
  scroller.addEventListener('touchstart', function() {
    var top = scroller.scrollTop;
    var totalScroll = scroller.scrollHeight;
    var currentScroll = top + scroller.offsetHeight;
    if (top <= 0) {
      scroller.scrollTop = 1;
    } else if (currentScroll >= totalScroll) {
      scroller.scrollTop = top - 1;
    }
  }, { passive: true });

  // 2. Intercept any touch moves outside the scroller (e.g. navbar, background, document boundaries)
  document.addEventListener('touchmove', function(e) {
    if (!scroller.contains(e.target)) {
      e.preventDefault();
    }
  }, { passive: false });
})();
</script>
