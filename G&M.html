<script>
document.addEventListener('DOMContentLoaded', function() {
  const bgMusic = document.getElementById('bg-music');
  const butterflyWrap = document.querySelector('.home-butterfly-wrap');
  const authBackdrop = document.getElementById('auth-backdrop');
  const btnViewDetails = document.getElementById('btn-view-details');
  const pinModal = document.getElementById('pin-modal');
  const btnPinCancel = document.getElementById('btn-pin-cancel');
  const btnPinSubmit = document.getElementById('btn-pin-submit');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');
  const bottomArch = document.getElementById('bottom-arch');

  // ── Persistent Theme Color Lock (#A71F23) ──
  function enforceThemeColor() {
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    metas.forEach(function(m) {
      m.setAttribute('content', '#A71F23');
    });
    if (document.documentElement) {
      document.documentElement.style.backgroundColor = '#A71F23';
    }
    if (document.body) {
      document.body.style.backgroundColor = '#A71F23';
    }
  }

  window.addEventListener('focus', enforceThemeColor, { passive: true });
  window.addEventListener('blur', enforceThemeColor, { passive: true });
  window.addEventListener('visibilitychange', enforceThemeColor, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', enforceThemeColor, { passive: true });
  }
  enforceThemeColor();

  function getCookie(name) {
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  function setCookie(name, val) {
    try {
      var maxAge = 365 * 24 * 60 * 60; // 1 year
      document.cookie = name + '=' + val + '; max-age=' + maxAge + '; path=/; SameSite=Lax';
    } catch(e) {}
  }

  function isAuthed() {
    return (
      sessionStorage.getItem('gtm2026_auth') === 'true' ||
      localStorage.getItem('gtm2026_auth') === 'true' ||
      localStorage.getItem('gtm2026_has_authenticated') === 'true' ||
      getCookie('gtm2026_auth') === 'true' ||
      getCookie('gtm2026_has_authenticated') === 'true'
    );
  }

  function setPersistentAuth() {
    try {
      sessionStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_has_authenticated', 'true');
      setCookie('gtm2026_auth', 'true');
      setCookie('gtm2026_has_authenticated', 'true');
    } catch(e) {}
  }

  function unlockAllTabs() {
    document.querySelectorAll('.fixed-bottom-nav .nav-tab').forEach(function(tab) {
      tab.classList.remove('is-locked');
    });
    if (btnViewDetails) {
      var label = btnViewDetails.querySelector('.home-unlock-details-label');
      if (label) label.textContent = 'View Details';
    }
  }

  if (isAuthed()) {
    unlockAllTabs();
    setPersistentAuth();
  }

  // ── Password Verification Logic ──
  function isCodeValid(val) {
    var clean = (val || '').trim().toLowerCase();
    return clean === 'gtm2026';
  }

  function checkPinInput() {
    if (!pinInput || !btnPinSubmit) return;
    const isValid = isCodeValid(pinInput.value);
    if (isValid) {
      btnPinSubmit.classList.add('is-enabled');
      btnPinSubmit.removeAttribute('disabled');
      if (pinError) pinError.style.display = 'none';
    } else {
      btnPinSubmit.classList.remove('is-enabled');
      btnPinSubmit.setAttribute('disabled', 'disabled');
    }
  }

  let isSubmitting = false;
  let blurTimeout = null;

  function submitPin(targetUrl) {
    if (pinInput && isCodeValid(pinInput.value)) {
      isSubmitting = true;
      if (blurTimeout) clearTimeout(blurTimeout);
      setPersistentAuth();
      sessionStorage.setItem('gtm2026_music_playing', (bgMusic && !bgMusic.paused) ? 'true' : 'false');
      unlockAllTabs();
      window.location.href = targetUrl || 'events.html';
    } else {
      isSubmitting = false;
      if (pinError) pinError.style.display = 'block';
    }
  }

  // ── Flow 1 & Flow 2 Controller ──
  window.handleOpenDetails = function(e, destination) {
    if (e && e.preventDefault) e.preventDefault();

    // Flow 2: Authenticated user -> direct instant navigation
    if (isAuthed()) {
      window.location.href = destination || 'events.html';
      return;
    }

    // Flow 1: New visitor -> trigger butterfly flight & open PIN modal
    if (butterflyWrap) {
      butterflyWrap.classList.add('fly-to-flowers');
    }
    if (authBackdrop) {
      authBackdrop.classList.add('expand-fullscreen');
    }
    if (btnViewDetails) {
      btnViewDetails.classList.add('is-hidden');
    }
    if (bottomArch) {
      bottomArch.classList.add('is-hidden');
    }
    if (pinModal) {
      pinModal.classList.add('is-active');
    }
    if (pinInput) {
      pinInput.focus();
      pinInput.select();
    }
    checkPinInput();
  };

  if (btnViewDetails) {
    btnViewDetails.addEventListener('click', function(e) {
      window.handleOpenDetails(e, 'events.html');
    });
  }

  // Intercept locked tab clicks
  document.querySelectorAll('.fixed-bottom-nav .nav-tab').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      var href = tab.getAttribute('href');
      if (href && href !== 'index.html' && !isAuthed()) {
        e.preventDefault();
        e.stopPropagation();
        window.handleOpenDetails(e, href);
      }
    });
  });

  function handleCloseModal() {
    if (!pinModal || !pinModal.classList.contains('is-active')) return;
    if (isSubmitting) return;

    if (blurTimeout) {
      clearTimeout(blurTimeout);
      blurTimeout = null;
    }

    if (pinInput) {
      pinInput.blur();
      pinInput.value = '';
      checkPinInput();
    }
    if (pinError) pinError.style.display = 'none';

    pinModal.classList.remove('is-active');

    if (authBackdrop) {
      authBackdrop.classList.remove('expand-fullscreen');
    }

    if (butterflyWrap) {
      butterflyWrap.classList.remove('fly-to-flowers');
    }

    setTimeout(() => {
      if (btnViewDetails) btnViewDetails.classList.remove('is-hidden');
      if (bottomArch) bottomArch.classList.remove('is-hidden');
    }, 400);
  }

  if (btnPinCancel) {
    btnPinCancel.addEventListener('click', function(e) {
      e.preventDefault();
      handleCloseModal();
    });
  }

  if (pinInput) {
    pinInput.addEventListener('input', checkPinInput);
    pinInput.addEventListener('change', checkPinInput);
    pinInput.addEventListener('keyup', checkPinInput);
    pinInput.addEventListener('paste', function() {
      setTimeout(checkPinInput, 10);
    });
    pinInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitPin();
      }
    });
  }

  if (btnPinSubmit) {
    btnPinSubmit.addEventListener('click', function(e) {
      e.preventDefault();
      submitPin();
    });
  }
});
</script>
