/* ── 1. Main Viewport & Stage ── */
.gxm-stage {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: #FFEFD4;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* ── 2. Scalable Inlined SVG Artwork Canvas ── */
.gxm-svg-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ── 3. Interactive Centerpiece: Vinyl Record Player ── */
.gxm-vinyl-anchor {
  position: absolute;
  top: 42.12%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  width: 180px;
  height: 180px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  outline: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.gxm-vinyl-anchor:active {
  transform: translate(-50%, -50%) scale(0.95);
}

.gxm-vinyl-disc {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;
  object-fit: contain;
  box-shadow: 0 12px 28px rgba(35, 10, 15, 0.4), 0 4px 10px rgba(0, 0, 0, 0.2);
  transform-origin: center center;
  will-change: transform;
}

.gxm-vinyl-anchor.is-playing .gxm-vinyl-disc {
  animation: spinVinyl 8s linear infinite;
}

@keyframes spinVinyl {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Vinyl Center Action Button */
.gxm-vinyl-center-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #A71F23;
  color: #FFFDF9;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.4);
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 11;
}

.gxm-play-icon {
  width: 14px;
  height: 14px;
  margin-left: 2px;
  fill: #FFFDF9;
  display: block;
}

.gxm-pause-icon {
  width: 14px;
  height: 14px;
  fill: #FFFDF9;
  display: none;
}

.gxm-vinyl-anchor.is-playing .gxm-play-icon {
  display: none;
}

.gxm-vinyl-anchor.is-playing .gxm-pause-icon {
  display: block;
}

.gxm-vinyl-anchor.is-playing .gxm-vinyl-center-btn {
  background: #87161A;
  box-shadow: 0 0 16px rgba(167, 31, 35, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4);
}

/* ── 4. Calligraphy & Wedding Typography Lockup ── */
.gxm-typography-lockup {
  position: absolute;
  top: 68.2%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  max-width: 400px;
  padding: 0 16px;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

.gxm-subtitle {
  font-family: 'Spectral', Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.2;
  letter-spacing: 1.68px;
  text-transform: uppercase;
  color: #003C3F;
  margin: 0 0 6px 0;
}

.gxm-names {
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.gxm-name {
  font-family: 'Kugile', 'Cinzel', serif;
  font-size: 50px;
  line-height: 46px;
  color: #A71F23;
  font-weight: 400;
  letter-spacing: -1.12px;
  text-shadow: 0px 1px 2px #FFFDF9;
}

.gxm-name-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin-top: -2px;
}

.gxm-amp {
  font-family: 'Snell Roundhand', 'SnellRoundhand', 'WindSong', cursive, serif;
  font-size: 50px;
  line-height: 46px;
  color: #A71F23;
  font-weight: 400;
  letter-spacing: -1px;
  margin-right: 6px;
}

/* ── 5. Responsive Adaptations ── */
@media (max-width: 380px) {
  .gxm-name, .gxm-amp {
    font-size: 42px;
    line-height: 38px;
  }
  .gxm-subtitle {
    font-size: 12px;
    letter-spacing: 1.4px;
  }
  .gxm-vinyl-anchor {
    width: 155px;
    height: 155px;
  }
}

@media (max-height: 720px) {
  .gxm-name, .gxm-amp {
    font-size: 40px;
    line-height: 36px;
  }
  .gxm-subtitle {
    font-size: 11px;
  }
  .gxm-vinyl-anchor {
    width: 150px;
    height: 150px;
  }
  .gxm-typography-lockup {
    top: 69%;
  }
}

/* ── 6. Universal Bottom Navigation ── */
nav.universal-bottom-nav {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100vw !important;
  height: 84px !important;
  min-height: 84px !important;
  max-height: 84px !important;
  background: rgba(255, 239, 212, 0.94) !important;
  backdrop-filter: blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
  border-top: 1px solid rgba(200, 150, 62, 0.25) !important;
  box-shadow: 0 -4px 20px rgba(74, 14, 23, 0.06) !important;
  z-index: 100 !important;
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  padding-bottom: env(safe-area-inset-bottom, 0px) !important;
  box-sizing: border-box !important;
  transform: translateZ(0) !important;
}

.nav-container {
  display: flex;
  justify-content: space-around;
  align-items: center;
  width: 100%;
  max-width: 440px;
  height: 100%;
  margin: 0 auto;
  padding: 0 8px;
  box-sizing: border-box;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #C8963E;
  opacity: 0.72;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  padding: 6px 12px;
  min-width: 64px;
  -webkit-tap-highlight-color: transparent;
}

.nav-item.active {
  color: #A71F23 !important;
  opacity: 1 !important;
  transform: translateY(-2px);
}

.nav-icon-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  margin-bottom: 3px;
}

.nav-icon {
  width: 24px;
  height: 24px;
  transition: transform 0.2s ease;
}

.nav-item.active .nav-icon {
  transform: scale(1.1);
}

.nav-label {
  font-family: 'Spectral', Georgia, serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  text-align: center;
  white-space: nowrap;
}

.nav-item.active .nav-label {
  font-weight: 800;
  color: #A71F23 !important;
}

  <script>
  /* ── Dynamic Live Event Countdown Ticker (Target: Nov 20, 2026 IST) ── */
  (function() {
    function updateCountdownTicker() {
      var dEl = document.getElementById('cntDays');
      var hEl = document.getElementById('cntHours');
      var mEl = document.getElementById('cntMins');
      var sEl = document.getElementById('cntSecs');
      if (!dEl || !hEl || !mEl || !sEl) return;

      var targetDate = new Date('2026-11-20T00:00:00+05:30').getTime();
      var now = new Date().getTime();
      var diff = Math.max(0, targetDate - now);

      var days = Math.floor(diff / (1000 * 60 * 60 * 24));
      var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var secs = Math.floor((diff % (1000 * 60)) / 1000);

      var pad = function(n) { return String(n).padStart(2, '0'); };

      dEl.textContent = days;
      hEl.textContent = pad(hours);
      mEl.textContent = pad(mins);
      sEl.textContent = pad(secs);
    }

    if (window.__GTM_TICKER_INTERVAL__) {
      clearInterval(window.__GTM_TICKER_INTERVAL__);
    }
    window.__GTM_TICKER_INTERVAL__ = setInterval(updateCountdownTicker, 1000);
    updateCountdownTicker();

    document.addEventListener('DOMContentLoaded', updateCountdownTicker);
    window.addEventListener('gtm:page-loaded', updateCountdownTicker);
  })();
