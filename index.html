  applyAuthTheme();
  document.addEventListener('DOMContentLoaded', applyAuthTheme);

  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 1. Golden Aura Radiant Breath */
.auth-seal-pulse-anchor::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 108px;
  height: 108px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 220, 80, 0.42) 0%, rgba(245, 175, 35, 0.22) 42%, rgba(200, 110, 15, 0.06) 68%, transparent 85%);
  pointer-events: none;
  opacity: 0.5;
  filter: blur(14px);
  animation: sealAuraPulse 3.4s ease-in-out infinite 3.5s;
  animation-fill-mode: both;
}

/* 2. Specular Golden Light Gleam / Shimmer across the Seal */
.auth-seal-shimmer-gleam {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 82px;
  height: 82px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
}

.auth-seal-shimmer-gleam::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -120%;
  width: 60%;
  height: 200%;
  background: linear-gradient(
    105deg,
    transparent 0%,
    rgba(255, 255, 255, 0.0) 25%,
    rgba(255, 245, 195, 0.65) 50%,
    rgba(255, 255, 255, 0.0) 75%,
    transparent 100%
  );
  transform: rotate(25deg);
  opacity: 0;
  animation: sealShimmerSweep 4.2s ease-in-out infinite 3.8s;
}

@keyframes sealAuraPulse {
  0%, 100% {
    opacity: 0.35;
    transform: translate(-50%, -50%) scale(0.92);
    filter: blur(12px);
  }
  50% {
    opacity: 0.75;
    transform: translate(-50%, -50%) scale(1.15);
    filter: blur(16px);
  }
}

@keyframes sealShimmerSweep {
  0% {
    left: -120%;
    opacity: 0;
  }
  15% {
    opacity: 0.85;
  }
  35% {
    left: 140%;
    opacity: 0;
  }
  100% {
    left: 140%;
    opacity: 0;
  }
}

.auth-viewport.is-code-active .auth-seal-pulse-anchor::before,

  display: none;

/* ── 4. Exit / Unlock Motion Sequence ── */

}

.auth-viewport.is-unlocking {

        <div class="auth-seal-shimmer-gleam"></div>
      </div>
    </div>

    <!-- ── 3. Bottom Section: Instruction Prompt (40px below envelope) ── -->
    <div class="auth-bottom-stack">
      <p class="auth-tap-prompt" id="auth-tap-prompt" data-i18n="auth.tap_prompt">TAP THE ENVELOPE TO OPEN</p>
    </div>

  </div>
</main>

<script src="js/cms-i18n.js?v=26300"></script>
<script src="js/spa-nav.js?v=26300"></script>
<script src="js/global-audio.js?v=26300"></script>
<script>
(function() {
  'use strict';

  var VALID_CODES = ['gtm2026', 'mrinalgarima', 'garimamrinal'];
  var input = document.getElementById('auth-code-input');
  var form = document.getElementById('auth-form');
  var pill = document.getElementById('auth-pill');
  var viewport = document.getElementById('auth-viewport');
  var envelopeBtn = document.getElementById('auth-envelope-btn');
  var isCodeActive = false;
  var isActivating = false;
  var isUnlocking = false;

  function normalize(val) {
    return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // ── Reset any previous session timestamp & start fresh from 0:00 ──
  try {
    sessionStorage.removeItem('gtm2026_music_time');
  } catch(e) {}

  // ── Start Audio Playback from the beginning via Direct User Gesture ──
  function ensureAudioPlaying(forceStart) {
    try {
      if (window.GTM_AUDIO && window.GTM_AUDIO.play) {
        window.GTM_AUDIO.play(forceStart !== false);
      }
      sessionStorage.setItem('gtm2026_music_playing', 'true');
      localStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}
  }

  // ── Activate Passcode Input & Raise Virtual Keyboard (Universal for iOS & Android) ──
  function activateInputAndKeyboard() {
    if (isUnlocking || isCodeActive) return;
    isCodeActive = true;
    isActivating = true;

    // 1. Play music immediately on this direct user touch gesture
    ensureAudioPlaying(true);

    // 2. Trigger active UI state
    if (viewport) {
      viewport.classList.add('is-code-active');
    }

    // 3. SYNCHRONOUS FOCUS for both iOS and Android Web Engines
    if (input) {
      try {
        input.focus({ preventScroll: true });
      } catch(e) {
        input.focus();
      }
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      if (document.documentElement) document.documentElement.scrollTop = 0;

      try {
        if (navigator.virtualKeyboard) {
          navigator.virtualKeyboard.overlaysContent = true;
          navigator.virtualKeyboard.show();
        }
      } catch(e) {}

      // Secondary micro-tick focus to guarantee Android IME brings up the keyboard after DOM reflow
      setTimeout(function() {
        if (input && !isUnlocking) {
          input.focus({ preventScroll: true });
          try {
            if (input.setSelectionRange) {
              var len = input.value.length;
              input.setSelectionRange(len, len);
            }
          } catch(e) {}
        }
      }, 40);
    }

    requestAnimationFrame(function() {
      window.scrollTo(0, 0);
    });

    setTimeout(function() {
      isActivating = false;
      window.scrollTo(0, 0);
    }, 300);
  }

  // Prevent any iOS window auto-scroll on input focus or visual viewport resize
  window.addEventListener('scroll', function() {
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
  }, { passive: true });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    });
    window.visualViewport.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });
  }

  if (input) {
    input.addEventListener('focus', function() {
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      if (document.documentElement) document.documentElement.scrollTop = 0;
    });
  }

  // Bind Envelope Tap
  if (envelopeBtn) {
    envelopeBtn.addEventListener('click', function(e) {
      if (!isCodeActive) {
        activateInputAndKeyboard();
      } else if (!isActivating) {
        validateAndSubmit();
      }
    });

    envelopeBtn.addEventListener('touchend', function(e) {
      if (!isCodeActive) {
        activateInputAndKeyboard();
      }
    }, { passive: true });
  }

  // Bind Bottom Prompt Tap
  var promptEl = document.getElementById('auth-tap-prompt');
  if (promptEl) {
    promptEl.addEventListener('click', function(e) {
      if (!isCodeActive) activateInputAndKeyboard();
    });
    promptEl.addEventListener('touchend', function(e) {
      if (!isCodeActive) {
        activateInputAndKeyboard();
      }
    }, { passive: true });
  }

  // Tapping anywhere on the viewport before activation triggers opening
  document.addEventListener('pointerdown', function(e) {
    if (isUnlocking || !input) return;
    if (!isCodeActive) {
      activateInputAndKeyboard();
    }
  }, { passive: true });

  // ── Keyboard Keep-Alive once active ──
  if (input) {
    input.addEventListener('blur', function() {
      if (isCodeActive && !isUnlocking && !isActivating) {
        requestAnimationFrame(function() {
          input.focus({ preventScroll: true });
        });
        setTimeout(function() {
          if (isCodeActive && !isUnlocking && document.activeElement !== input) {
            input.focus({ preventScroll: true });
          }
        }, 30);
      }
    });
  }

  // ── Error Shake Feedback (Only on actual incorrect code submission) ──
  function triggerError() {
    if (!pill) return;
    pill.classList.remove('has-error');
    void pill.offsetWidth; // Force reflow
    pill.classList.add('has-error');
    setTimeout(function() {
      pill.classList.remove('has-error');
      if (input) {
        input.value = '';
        input.focus({ preventScroll: true });
      }
    }, 600);
  }

  // ── Unlock & Seamless SPA Transition Sequence ──
  function handleSuccessfulUnlock(code) {
    if (isUnlocking) return;
    isUnlocking = true;

    // 1. Maintain 1-year persistent cookie
    var maxAge = 365 * 24 * 60 * 60;
    document.cookie = 'gtm2026_auth=true; max-age=' + maxAge + '; path=/; SameSite=Lax';
    document.cookie = 'gtm2026_has_authenticated=true; max-age=' + maxAge + '; path=/; SameSite=Lax';

    // 2. Set storage keys
    try {
      localStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_has_authenticated', 'true');
      localStorage.setItem('wedding_access_key', code);
      localStorage.setItem('gtm2026_music_playing', 'true');
      sessionStorage.setItem('gtm2026_auth', 'true');
      sessionStorage.setItem('wedding_access_key', code);
      sessionStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}

    // 3. Ensure audio is playing
    ensureAudioPlaying(false);

    // 4. Trigger Exit Motion Sequence
    if (viewport) {
      viewport.classList.add('is-unlocking');
    }

    // 5. Seamlessly navigate to G&M.html without reloading the page or dropping audio
    setTimeout(function() {
      if (window.GTM_SPA && window.GTM_SPA.navigateTo) {
        window.GTM_SPA.navigateTo('G&M.html', true);
      } else {
        window.location.replace('G&M.html');
      }
    }, 600);
  }

  function validateAndSubmit() {
    if (isUnlocking || isActivating || !input) return;
    var norm = normalize(input.value);

    // If input is empty, do not trigger error
    if (!norm || norm === '') {
      return;
    }

    // Strict validation: must match complete passcode
    if (VALID_CODES.indexOf(norm) !== -1) {
      handleSuccessfulUnlock(norm);
    } else {
      triggerError();
    }
  }

  // Submit on Form submit (Enter key)
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Auto-submit when complete matching passcode is typed
  if (input) {
    input.addEventListener('input', function() {
      var norm = normalize(this.value);
      if (VALID_CODES.indexOf(norm) !== -1) {
        handleSuccessfulUnlock(norm);
      }
    });
  }
})();
</script>
</body>
