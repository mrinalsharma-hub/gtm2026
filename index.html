<script>
(function() {
  function getCookie(name) {
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }
  // Check if already authenticated via cookie or storage
  var isAuth = getCookie('gtm2026_auth') === 'true' ||
               getCookie('gtm2026_has_authenticated') === 'true' ||
               localStorage.getItem('gtm2026_auth') === 'true' ||
               localStorage.getItem('gtm2026_has_authenticated') === 'true' ||
               localStorage.getItem('wedding_access_key');
  if (isAuth) {
    window.location.replace('G&M.html');
  }
})();
</script>

/* ── Anchored Envelope Stage Wrapper: 25px above exact center (top anchored to upper 1/3rd) ── */
.auth-envelope-wrapper {
  position: absolute;
  top: calc(50% - 25px);
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

              transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 10;
  animation: envelopeSlideInCenter 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
}

@keyframes envelopeSlideInCenter {
  0% {
    opacity: 0;
    transform: translate(100vw, -50%) rotate(8deg) scale(0.9);
  }
  65% {
    opacity: 1;
    transform: translate(-53%, -50%) rotate(-1deg) scale(1.01);
  }
  85% {
    transform: translate(-49.5%, -50%) rotate(0.4deg) scale(0.998);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(0deg) scale(1);
  }
}

/* ── 5. Exit / Unlock Motion Sequence ── */

<script>
(function() {
  'use strict';

  var VALID_CODES = ['gtm2026', 'mrinalgarima', 'garimamrinal'];
  var input = document.getElementById('auth-code-input');
  var form = document.getElementById('auth-form');
  var pill = document.getElementById('auth-pill');
  var viewport = document.getElementById('auth-viewport');
  var sealBtn = document.getElementById('auth-seal-btn');
  var isCodeActive = false;
  var isActivating = false;
  var isUnlocking = false;

  function normalize(val) {
    return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // ── Start Audio Playback via Direct User Gesture ──
  function ensureAudioPlaying() {
    try {
      if (window.GTM_AUDIO && window.GTM_AUDIO.play) {
        window.GTM_AUDIO.play();
      }
      sessionStorage.setItem('gtm2026_music_playing', 'true');
      localStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}
  }

  // ── Activate Passcode Input & Raise Virtual Keyboard ──
  function activateInputAndKeyboard() {
    if (isUnlocking || isCodeActive) return;
    isCodeActive = true;
    isActivating = true;

    // 1. Play music immediately on this user touch gesture
    ensureAudioPlaying();

    // 2. Trigger upward glide to top edge & expand input field
    if (viewport) {
      viewport.classList.add('is-code-active');
    }

    // 3. Focus input smoothly after expansion starts to raise keyboard reliably
    setTimeout(function() {
      if (input) {
        input.focus({ preventScroll: true });
        try {
          if ('virtualKeyboard' in navigator) {
            navigator.virtualKeyboard.overlaysContent = true;
            navigator.virtualKeyboard.show();
          }
        } catch(e) {}
      }
      // Release activating lockout after transition settles
      setTimeout(function() {
        isActivating = false;
      }, 300);
    }, 180);
  }

  // Bind Seal Tap & Envelope Interaction
  if (sealBtn) {
    sealBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (!isCodeActive) {
        activateInputAndKeyboard();
      } else if (!isActivating) {
        validateAndSubmit();
      }
    });

    sealBtn.addEventListener('touchend', function(e) {
      if (!isCodeActive) {
        e.preventDefault();
        activateInputAndKeyboard();
      }
    });
  }

  // Tapping anywhere on the envelope before activation triggers opening
  document.addEventListener('pointerdown', function(e) {
    if (isUnlocking || !input) return;
    if (!isCodeActive) {
      activateInputAndKeyboard();
    } else if (!isActivating) {
      if (e.target !== input && e.target !== sealBtn && (!sealBtn || !sealBtn.contains(e.target))) {
        if (e.cancelable && e.type !== 'click') {
          e.preventDefault();
        }
        input.focus({ preventScroll: true });
      }
    }
  }, { passive: false });

  // ── Keyboard Keep-Alive once active ──
  if (input) {
    input.addEventListener('blur', function() {
      if (isCodeActive && !isUnlocking && !isActivating) {
        requestAnimationFrame(function() {
          input.focus({ preventScroll: true });
        });
        setTimeout(function() {
          if (isCodeActive && !isUnlocking && document.activeElement !== input) {
            input.focus({ preventScroll: true });
          }
        }, 30);
      }
    });
  }

  // ── Error Shake Feedback (Only on actual incorrect code submission) ──
  function triggerError() {
    if (!pill) return;
    pill.classList.remove('has-error');
    void pill.offsetWidth; // Force reflow
    pill.classList.add('has-error');
    setTimeout(function() {
      pill.classList.remove('has-error');
      if (input) {
        input.value = '';
        input.focus({ preventScroll: true });
      }
    }, 600);
  }

  // ── Unlock & Seamless SPA Transition Sequence ──
  function handleSuccessfulUnlock(code) {
    if (isUnlocking) return;
    isUnlocking = true;

    // 1. Maintain 1-year persistent cookie
    var maxAge = 365 * 24 * 60 * 60;
    document.cookie = 'gtm2026_auth=true; max-age=' + maxAge + '; path=/; SameSite=Lax';
    document.cookie = 'gtm2026_has_authenticated=true; max-age=' + maxAge + '; path=/; SameSite=Lax';

    // 2. Set storage keys
    try {
      localStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_has_authenticated', 'true');
      localStorage.setItem('wedding_access_key', code);
      localStorage.setItem('gtm2026_music_playing', 'true');
      sessionStorage.setItem('gtm2026_auth', 'true');
      sessionStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}

    // 3. Ensure audio is playing
    ensureAudioPlaying();

    // 4. Trigger Delightful Exit Motion Sequence
    if (viewport) {
      viewport.classList.add('is-unlocking');
    }

    // 5. Seamlessly navigate to G&M.html without reloading the page or dropping audio
    setTimeout(function() {
      if (window.GTM_SPA && window.GTM_SPA.navigateTo) {
        window.GTM_SPA.navigateTo('G&M.html', true);
      } else {
        window.location.replace('G&M.html');
      }
    }, 600);
  }

  function validateAndSubmit() {
    if (isUnlocking || isActivating || !input) return;
    var norm = normalize(input.value);

    // If input is empty, do not trigger error
    if (!norm || norm === '') {
      return;
    }

    // Strict validation: must match complete passcode
    if (VALID_CODES.indexOf(norm) !== -1) {
      handleSuccessfulUnlock(norm);
    } else {
      triggerError();
    }
  }

  // Submit on Form submit (Enter key)
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Auto-submit when complete matching passcode is typed
  if (input) {
    input.addEventListener('input', function() {
      var norm = normalize(this.value);
      if (VALID_CODES.indexOf(norm) !== -1) {
        handleSuccessfulUnlock(norm);
      }
    });
  }
})();
</script>
