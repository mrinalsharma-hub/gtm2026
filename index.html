<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
  function getCookie(name) {
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }
  // Check if already authenticated via cookie or storage
  var isAuth = getCookie('gtm2026_auth') === 'true' ||
               localStorage.getItem('gtm2026_auth') === 'true' ||
               localStorage.getItem('wedding_access_key');
  if (isAuth) {
    window.location.replace('G&M.html');
  }
})();
</script>

<style>
@font-face {
  font-family: 'Kugile';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/Kugile.ttf?v=24700') format('truetype'),
       url('fonts/Kugile_Demo.ttf?v=24700') format('truetype'),
       local('Kugile');
}

@font-face {
  font-family: 'Snell Roundhand';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: local('Snell Roundhand'),
       local('SnellRoundhand'),
       url('fonts/SnellRoundhand.woff?v=24700') format('woff'),
       url('fonts/SnellRoundhand.ttf?v=24700') format('truetype');
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background-color: #380E13;
  font-family: 'Spectral', Georgia, serif;
  color: #FFFFFF;
}

.auth-viewport {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: radial-gradient(circle at 50% 30%, #4D151B 0%, #380E13 70%, #29080B 100%);
  overflow: hidden;
  opacity: 0;
  animation: authFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes authFadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

/* ── Textured Envelope Layers ── */
.envelope-art-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.envelope-top-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 60%;
  background: linear-gradient(180deg, rgba(65, 16, 22, 0.95) 0%, rgba(50, 12, 17, 0.98) 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  z-index: 2;
  transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
}

.envelope-left-fold {
  position: absolute;
  top: 0;
  left: 0;
  width: 55%;
  height: 100%;
  background: linear-gradient(135deg, rgba(45, 10, 14, 0.9) 0%, rgba(35, 8, 11, 0.95) 100%);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
  z-index: 1;
}

.envelope-right-fold {
  position: absolute;
  top: 0;
  right: 0;
  width: 55%;
  height: 100%;
  background: linear-gradient(225deg, rgba(45, 10, 14, 0.9) 0%, rgba(35, 8, 11, 0.95) 100%);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
  z-index: 1;
}

/* ── Content Stack ── */
.auth-content-stack {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: env(safe-area-inset-top, 24px) 24px 0 24px;
  margin-top: 5vh;
}

/* ── 1. Heading Lockup ── */
.auth-heading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(-16px);
  animation: authSlideDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}

@keyframes authSlideDown {
  to { opacity: 1; transform: translateY(0); }
}

.auth-eyebrow {
  font-family: 'Spectral', Georgia, serif;
  font-weight: 700;
  font-size: 13px;
  line-height: 1;
  letter-spacing: 1.68px;
  text-transform: uppercase;
  color: #FFFFFF;
  opacity: 0.92;
  margin-bottom: 12px;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
}

.auth-names {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.auth-name {
  font-family: 'Kugile', Georgia, serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: #FFFFFF;
  line-height: 1.1;
}

.auth-ampersand {
  font-family: 'Snell Roundhand', cursive, serif;
  font-size: 38px;
  color: #D4AF37;
  line-height: 0.8;
  margin: 0 2px;
}

/* ── 2. Passcode Input Form ── */
.auth-form {
  width: 100%;
  max-width: 368px;
  margin-top: 32px;
  position: relative;
  opacity: 0;
  transform: translateY(16px);
  animation: authSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

@keyframes authSlideUp {
  to { opacity: 1; transform: translateY(0); }
}

.auth-input-pill {
  width: 100%;
  height: 56px;
  background: #F4DFBC;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
  position: relative;
  border: 1.5px solid rgba(212, 175, 55, 0.4);
  transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
}

.auth-input-pill:focus-within {
  border-color: #D4AF37;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 12px rgba(212, 175, 55, 0.35);
}

.auth-code-input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Spectral', Georgia, serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 3.52px;
  text-align: center;
  text-transform: uppercase;
  color: #380E13;
  caret-color: #A71F23;
}

.auth-code-input::placeholder {
  font-family: 'Spectral', Georgia, serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 3.52px;
  color: rgba(56, 14, 19, 0.35);
  text-transform: uppercase;
}

/* ── Error Shake Animation ── */
.auth-input-pill.has-error {
  animation: authShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  border-color: #E63946 !important;
  box-shadow: 0 0 16px rgba(230, 57, 70, 0.6) !important;
}

@keyframes authShake {
  10%, 90% { transform: translate3d(-4px, 0, 0); }
  20%, 80% { transform: translate3d(6px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
  40%, 60% { transform: translate3d(6px, 0, 0); }
}

/* ── 3. Golden Wax Seal Element ── */
.auth-seal-wrap {
  position: relative;
  margin-top: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.85);
  animation: authSealDrop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards;
  cursor: pointer;
}

@keyframes authSealDrop {
  to { opacity: 1; transform: scale(1); }
}

.auth-seal-img {
  width: 120px;
  height: 120px;
  object-fit: contain;
  filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.65)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
  user-select: none;
  -webkit-user-drag: none;
}

/* ── 4. Exit / Unlock Motion Sequence ── */
.auth-viewport.is-unlocking {
  pointer-events: none;
}

.auth-viewport.is-unlocking .auth-heading-wrap {
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
  transform: translateY(-40px) scale(0.95);
  opacity: 0;
}

.auth-viewport.is-unlocking .auth-form {
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
  transform: translateY(30px) scale(0.95);
  opacity: 0;
}

.auth-viewport.is-unlocking .auth-seal-img {
  animation: sealGlowUnlock 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes sealGlowUnlock {
  0% { transform: scale(1); filter: drop-shadow(0 8px 18px rgba(0,0,0,0.65)); }
  40% { transform: scale(1.22) rotate(6deg); filter: drop-shadow(0 0 30px #FFD700) drop-shadow(0 8px 24px rgba(0,0,0,0.8)); }
  100% { transform: scale(1.35) rotate(10deg); opacity: 0; filter: drop-shadow(0 0 50px #FFF) drop-shadow(0 0 80px #FFD700); }
}

.auth-viewport.is-unlocking .envelope-top-flap {
  transform: translateY(-80%) scaleY(0.4);
  opacity: 0;
}

.auth-viewport.is-unlocking {
  transition: opacity 0.8s ease 0.3s;
}
</style>
</head>
<body>

<main class="auth-viewport" id="auth-viewport">
  <!-- Envelope Geometry Backdrop -->
  <div class="envelope-art-container" aria-hidden="true">
    <div class="envelope-left-fold"></div>
    <div class="envelope-right-fold"></div>
    <div class="envelope-top-flap"></div>
  </div>

  <div class="auth-content-stack">
    <!-- 1. Heading Lockup -->
    <div class="auth-heading-wrap">
      <p class="auth-eyebrow">YOU HAVE BEEN INVITED!</p>
      <div class="auth-names">
        <span class="auth-name">GARIMA</span>
        <span class="auth-ampersand">&amp;</span>
        <span class="auth-name">MRINAL</span>
      </div>
    </div>

    <!-- 2. Code Input Form -->
    <form class="auth-form" id="auth-form" onsubmit="return false;" autocomplete="off">
      <div class="auth-input-pill" id="auth-pill">
        <input 
          type="text" 
          id="auth-code-input" 
          class="auth-code-input" 
          placeholder="ENTER CODE PROVIDED" 
          aria-label="Wedding Invitation Passcode" 
          autofocus 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="characters" 
          spellcheck="false"
          required>
      </div>
    </form>

    <!-- 3. Golden Wax Seal -->
    <div class="auth-seal-wrap" id="auth-seal-btn" role="button" aria-label="Unlock Wedding Invitation">
      <img src="images/home/image12_554_2091.webp" alt="Golden Flower Wax Seal" class="auth-seal-img" width="120" height="120" onerror="this.onerror=null;this.src='images/home/image12_554_2091.png';">
    </div>
  </div>
</main>

<script>
(function() {
  'use strict';

  var VALID_CODES = ['gtm2026', 'mrinalgarima', 'garimamrinal', 'gtm'];
  var input = document.getElementById('auth-code-input');
  var form = document.getElementById('auth-form');
  var pill = document.getElementById('auth-pill');
  var viewport = document.getElementById('auth-viewport');
  var sealBtn = document.getElementById('auth-seal-btn');
  var isUnlocking = false;

  function normalize(val) {
    return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // ── Keyboard Keep-Alive: Keep focused at all times ──
  function lockFocus() {
    if (isUnlocking) return;
    if (input && document.activeElement !== input) {
      input.focus();
    }
  }

  window.addEventListener('DOMContentLoaded', lockFocus);
  window.addEventListener('load', lockFocus);
  
  if (input) {
    input.addEventListener('blur', function() {
      if (!isUnlocking) {
        setTimeout(lockFocus, 15);
      }
    });
  }

  document.addEventListener('touchstart', function(e) {
    if (!isUnlocking && input && e.target !== input) {
      input.focus();
    }
  }, { passive: true });

  document.addEventListener('click', function(e) {
    if (!isUnlocking && input && e.target !== input) {
      input.focus();
    }
  });

  // ── Error Shake Feedback ──
  function triggerError() {
    if (!pill) return;
    pill.classList.remove('has-error');
    void pill.offsetWidth; // Trigger reflow
    pill.classList.add('has-error');
    setTimeout(function() {
      pill.classList.remove('has-error');
      if (input) {
        input.value = '';
        lockFocus();
      }
    }, 600);
  }

  // ── Unlock & Transition Sequence ──
  function handleSuccessfulUnlock(code) {
    if (isUnlocking) return;
    isUnlocking = true;

    // 1. Maintain 1-year persistent cookie
    var maxAge = 365 * 24 * 60 * 60;
    document.cookie = 'gtm2026_auth=true; max-age=' + maxAge + '; path=/; SameSite=Lax';
    document.cookie = 'gtm2026_has_authenticated=true; max-age=' + maxAge + '; path=/; SameSite=Lax';

    // 2. Set storage keys
    try {
      localStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('wedding_access_key', code);
      sessionStorage.setItem('gtm2026_auth', 'true');
      sessionStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}

    // 3. Trigger Audio Playback via Global Audio API
    try {
      var audio = new Audio('media/Samne_Yeh_Kaun_Aaya.mp3');
      audio.volume = 0.85;
      audio.play().catch(function(err) {
        console.warn('Audio auto-start:', err);
      });
    } catch(e) {}

    // 4. Trigger Delightful Exit Motion Sequence
    if (viewport) {
      viewport.classList.add('is-unlocking');
    }

    // 5. Navigate to G&M.html smoothly
    setTimeout(function() {
      window.location.replace('G&M.html');
    }, 700);
  }

  function validateAndSubmit() {
    if (isUnlocking || !input) return;
    var norm = normalize(input.value);
    
    if (VALID_CODES.indexOf(norm) !== -1 || norm === 'gtm2026') {
      handleSuccessfulUnlock(norm || 'gtm2026');
    } else {
      triggerError();
    }
  }

  // Submit on Form submit (Enter key)
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Also submit if seal is clicked
  if (sealBtn) {
    sealBtn.addEventListener('click', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Auto-submit if exact valid code length reached
  if (input) {
    input.addEventListener('input', function() {
      var norm = normalize(this.value);
      if (VALID_CODES.indexOf(norm) !== -1) {
        handleSuccessfulUnlock(norm);
      }
    });
  }
})();
</script>
</body>
</html>
