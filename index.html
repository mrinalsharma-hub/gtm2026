<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
  function getCookie(name) {
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }
  // Check if already authenticated via cookie or storage
  var isAuth = getCookie('gtm2026_auth') === 'true' ||
               getCookie('gtm2026_has_authenticated') === 'true' ||
               localStorage.getItem('gtm2026_auth') === 'true' ||
               localStorage.getItem('gtm2026_has_authenticated') === 'true' ||
               localStorage.getItem('wedding_access_key');
  if (isAuth) {
    window.location.replace('G&M.html');
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2F1216">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2F1216">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2F1216">

<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64x64.png?v=26300">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=26300">

<!-- Preload critical fonts & assets -->
<link rel="preload" as="font" href="fonts/Kugile.ttf?v=24700" type="font/ttf" crossorigin>
<link rel="preload" as="font" href="fonts/SnellRoundhand.woff?v=24700" type="font/woff" crossorigin>

<link rel="preload" as="image" href="images/auth/seal_flower.webp" type="image/webp" fetchpriority="high">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'Kugile';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/Kugile.ttf?v=24700') format('truetype'),
       url('fonts/Kugile_Demo.ttf?v=24700') format('truetype'),
       local('Kugile');
}

@font-face {
  font-family: 'Snell Roundhand';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: local('Snell Roundhand'),
       local('SnellRoundhand'),
       url('fonts/SnellRoundhand.woff?v=24700') format('woff'),
       url('fonts/SnellRoundhand.ttf?v=24700') format('truetype');
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #2F1216;
  font-family: 'Spectral', Georgia, serif;
  color: #FFFFFF;
  touch-action: pan-x pan-y;
  user-select: none;
  -webkit-user-select: none;
}

.auth-viewport {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background-color: #2F1216;
  overflow: hidden;
  opacity: 0;
  animation: authFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes authFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ── 1:1 Pixel-Perfect Background Envelope (Seamless Maroon Blend, Zero White Border) ── */
.auth-envelope-stage {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 440px;
  height: 380px;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.auth-envelope-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
  -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 90%, transparent 100%);
}

/* ── Content Stack (Strict 40px Top Gap) ── */
.auth-content-stack {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 440px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 40px;
  padding-left: 24px;
  padding-right: 24px;
  box-sizing: border-box;
}

/* ── 1. Heading Lockup (Strict 2-Line Figma Structure) ── */
.auth-heading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(-10px);
  animation: authSlideDown 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
}

@keyframes authSlideDown {
  to { opacity: 1; transform: translateY(0); }
}

.auth-eyebrow {
  font-family: 'Spectral', Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  line-height: 1;
  letter-spacing: 1.68px;
  text-transform: uppercase;
  color: #FFFFFF;
  margin-bottom: 20px;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

.auth-names {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}

.auth-name-line-1 {
  font-family: 'Kugile', Georgia, serif;
  font-size: 28px;
  line-height: 30px;
  letter-spacing: 1px;
  color: #FFFFFF;
  text-transform: uppercase;
}

.auth-name-line-2 {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  line-height: 25px;
  margin-top: -2px;
}

.auth-ampersand {
  font-family: 'Snell Roundhand', cursive, serif;
  font-size: 40px;
  color: #FFFFFF;
  line-height: 21.6px;
  margin-right: 2px;
}

.auth-name-text {
  font-family: 'Kugile', Georgia, serif;
  font-size: 28px;
  line-height: 25px;
  letter-spacing: 1px;
  color: #FFFFFF;
  text-transform: uppercase;
}

/* ── 2. Passcode Input Form (Figma 31px Gap) ── */
.auth-form {
  width: 100%;
  max-width: 368px;
  margin-top: 31px;
  position: relative;
  opacity: 0;
  transform: translateY(12px);
  animation: authSlideUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
}

@keyframes authSlideUp {
  to { opacity: 1; transform: translateY(0); }
}

.auth-input-pill {
  width: 100%;
  height: 56px;
  background: #F4DFBC;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  position: relative;
  border: 1.5px solid rgba(212, 175, 55, 0.35);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.auth-input-pill:focus-within {
  border-color: #D4AF37;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), 0 0 14px rgba(212, 175, 55, 0.4);
}

.auth-code-input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Spectral', Georgia, serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 3.52px;
  text-align: center;
  text-transform: uppercase;
  color: #380E13;
  caret-color: #A71F23;
}

.auth-code-input::placeholder {
  font-family: 'Spectral', Georgia, serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 3.52px;
  text-align: center;
  color: rgba(56, 14, 19, 0.35);
  text-transform: uppercase;
}

/* ── Error Shake Feedback ── */
.auth-input-pill.has-error {
  animation: authShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  border-color: #E63946 !important;
  box-shadow: 0 0 18px rgba(230, 57, 70, 0.65) !important;
}

@keyframes authShake {
  10%, 90% { transform: translate3d(-5px, 0, 0); }
  20%, 80% { transform: translate3d(7px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
  40%, 60% { transform: translate3d(7px, 0, 0); }
}

/* ── 3. Golden Flower Wax Seal (Figma Node 60:849) ── */
.auth-seal-wrap {
  position: relative;
  margin-top: 14px;
  width: 136px;
  height: 136px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.9);
  animation: authSealDrop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
  cursor: pointer;
  touch-action: manipulation;
}

@keyframes authSealDrop {
  to { opacity: 1; transform: scale(1); }
}

.auth-seal-img {
  width: 136px;
  height: 136px;
  object-fit: contain;
  filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.15)) drop-shadow(0px 4px 30px rgba(0, 0, 0, 0.7));
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
  user-select: none;
  -webkit-user-drag: none;
}

/* ── 4. Exit / Unlock Motion Sequence ── */
.auth-viewport.is-unlocking {
  pointer-events: none;
}

.auth-viewport.is-unlocking .auth-heading-wrap {
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
  transform: translateY(-35px) scale(0.96);
  opacity: 0;
}

.auth-viewport.is-unlocking .auth-form {
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
  transform: translateY(25px) scale(0.96);
  opacity: 0;
}

.auth-viewport.is-unlocking .auth-seal-img {
  animation: sealGlowUnlock 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes sealGlowUnlock {
  0% { transform: scale(1); filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.15)) drop-shadow(0px 4px 30px rgba(0, 0, 0, 0.7)); }
  40% { transform: scale(1.2) rotate(6deg); filter: drop-shadow(0 0 35px #FFD700) drop-shadow(0 8px 24px rgba(0,0,0,0.8)); }
  100% { transform: scale(1.35) rotate(10deg); opacity: 0; filter: drop-shadow(0 0 60px #FFF) drop-shadow(0 0 90px #FFD700); }
}

.auth-viewport.is-unlocking .auth-envelope-bg {
  transform: translateY(-40px) scale(1.05);
  opacity: 0;
}

.auth-viewport.is-unlocking {
  transition: opacity 0.75s ease 0.3s;
}
</style>
</head>
<body>

<main class="auth-viewport" id="auth-viewport">
  <!-- Exact Figma Envelope Background (Seamless Maroon, Zero Cream Line) -->
  <div class="auth-envelope-stage" aria-hidden="true">
    <picture>
      <source srcset="images/auth/envelope_bg.webp" type="image/webp">
      <img src="images/auth/envelope_bg.png" alt="Wedding Invitation Envelope" class="auth-envelope-bg" width="440" height="380">
    </picture>
  </div>

  <div class="auth-content-stack">
    <!-- 1. Heading Lockup (Strict 2-Line Layout with 20px gap) -->
    <div class="auth-heading-wrap">
      <p class="auth-eyebrow">YOU HAVE BEEN INVITED!</p>
      <div class="auth-names">
        <div class="auth-name-line-1">GARIMA</div>
        <div class="auth-name-line-2">
          <span class="auth-ampersand">&amp;</span>
          <span class="auth-name-text">MRINAL</span>
        </div>
      </div>
    </div>

    <!-- 2. Passcode Input Form -->
    <form class="auth-form" id="auth-form" onsubmit="return false;" autocomplete="off">
      <div class="auth-input-pill" id="auth-pill">
        <input 
          type="text" 
          id="auth-code-input" 
          class="auth-code-input" 
          placeholder="ENTER CODE PROVIDED" 
          aria-label="Wedding Invitation Passcode" 
          autofocus 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="characters" 
          spellcheck="false"
          inputmode="text"
          enterkeyhint="go"
          required>
      </div>
    </form>

    <!-- 3. Golden Flower Wax Seal -->
    <div class="auth-seal-wrap" id="auth-seal-btn" role="button" aria-label="Unlock Wedding Invitation">
      <picture>
        <source srcset="images/auth/seal_flower.webp" type="image/webp">
        <img src="images/auth/seal_flower.png" alt="Golden Flower Wax Seal" class="auth-seal-img" width="136" height="136">
      </picture>
    </div>
  </div>
</main>

<script>
(function() {
  'use strict';

  // Strict valid passcodes: only complete valid codes (no short partials like "gtm")
  var VALID_CODES = ['gtm2026', 'mrinalgarima', 'garimamrinal'];
  var input = document.getElementById('auth-code-input');
  var form = document.getElementById('auth-form');
  var pill = document.getElementById('auth-pill');
  var viewport = document.getElementById('auth-viewport');
  var sealBtn = document.getElementById('auth-seal-btn');
  var isUnlocking = false;

  function normalize(val) {
    return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // ── Keyboard Keep-Alive & Robust Focus Lock ──
  function lockFocus() {
    if (isUnlocking || !input) return;
    try {
      if (document.activeElement !== input) {
        input.focus({ preventScroll: true });
      }
      if ('virtualKeyboard' in navigator) {
        navigator.virtualKeyboard.overlaysContent = true;
        navigator.virtualKeyboard.show();
      }
    } catch(e) {}
  }

  // Focus immediately on script parse, DOM ready, and load
  lockFocus();
  window.addEventListener('DOMContentLoaded', lockFocus);
  window.addEventListener('load', lockFocus);
  window.addEventListener('pageshow', lockFocus);

  // Prevent keyboard dismiss on blur
  if (input) {
    input.addEventListener('blur', function() {
      if (!isUnlocking) {
        requestAnimationFrame(lockFocus);
        setTimeout(lockFocus, 20);
        setTimeout(lockFocus, 80);
      }
    });
  }

  // Intercept all outside taps/clicks to keep keyboard permanently raised on Android & iOS
  function handleOutsideInteraction(e) {
    if (isUnlocking || !input) return;
    if (sealBtn && (e.target === sealBtn || sealBtn.contains(e.target))) {
      return; // Allow seal click to trigger unlock validation
    }
    if (e.target !== input) {
      if (e.cancelable && e.type !== 'click') {
        e.preventDefault();
      }
      input.focus({ preventScroll: true });
      if (typeof input.click === 'function') {
        input.click();
      }
    }
  }

  window.addEventListener('pointerdown', handleOutsideInteraction, { passive: false });
  window.addEventListener('touchstart', handleOutsideInteraction, { passive: false });
  window.addEventListener('mousedown', handleOutsideInteraction, { passive: false });
  window.addEventListener('click', handleOutsideInteraction);

  // If visual viewport resizes (e.g. user minimized keyboard on Android), bring it right back
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      if (!isUnlocking && window.visualViewport.height >= window.innerHeight * 0.85) {
        setTimeout(lockFocus, 40);
      }
    });
  }

  // Heartbeat focus check
  setInterval(function() {
    if (!isUnlocking && document.activeElement !== input) {
      lockFocus();
    }
  }, 200);

  // ── Error Shake Feedback ──
  function triggerError() {
    if (!pill) return;
    pill.classList.remove('has-error');
    void pill.offsetWidth; // Force reflow
    pill.classList.add('has-error');
    setTimeout(function() {
      pill.classList.remove('has-error');
      if (input) {
        input.value = '';
        lockFocus();
      }
    }, 600);
  }

  // ── Unlock & Transition Sequence ──
  function handleSuccessfulUnlock(code) {
    if (isUnlocking) return;
    isUnlocking = true;

    // 1. Maintain 1-year persistent cookie
    var maxAge = 365 * 24 * 60 * 60;
    document.cookie = 'gtm2026_auth=true; max-age=' + maxAge + '; path=/; SameSite=Lax';
    document.cookie = 'gtm2026_has_authenticated=true; max-age=' + maxAge + '; path=/; SameSite=Lax';

    // 2. Set storage keys
    try {
      localStorage.setItem('gtm2026_auth', 'true');
      localStorage.setItem('gtm2026_has_authenticated', 'true');
      localStorage.setItem('wedding_access_key', code);
      localStorage.setItem('gtm2026_music_playing', 'true');
      sessionStorage.setItem('gtm2026_auth', 'true');
      sessionStorage.setItem('gtm2026_music_playing', 'true');
    } catch(e) {}

    // 3. Trigger Audio Playback via Global Audio API
    try {
      var audio = new Audio('media/Samne_Yeh_Kaun_Aaya.mp3');
      audio.volume = 0.85;
      audio.play().catch(function(err) {
        console.warn('Audio start:', err);
      });
    } catch(e) {}

    // 4. Trigger Delightful Exit Motion Sequence
    if (viewport) {
      viewport.classList.add('is-unlocking');
    }

    // 5. Navigate to G&M.html smoothly
    setTimeout(function() {
      window.location.replace('G&M.html');
    }, 700);
  }

  function validateAndSubmit() {
    if (isUnlocking || !input) return;
    var norm = normalize(input.value);

    // Strict validation: must match complete passcode
    if (VALID_CODES.indexOf(norm) !== -1) {
      handleSuccessfulUnlock(norm);
    } else {
      triggerError();
    }
  }

  // Submit on Form submit (Enter key)
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Submit if seal is clicked
  if (sealBtn) {
    sealBtn.addEventListener('click', function(e) {
      e.preventDefault();
      validateAndSubmit();
    });
  }

  // Auto-submit only when complete matching passcode is typed
  if (input) {
    input.addEventListener('input', function() {
      var norm = normalize(this.value);
      if (VALID_CODES.indexOf(norm) !== -1) {
        handleSuccessfulUnlock(norm);
      }
    });
  }
})();
</script>
</body>
</html>
